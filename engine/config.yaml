# ================================================================================
# (C) IDEA 1 -- EARLIEST-FINISH-TIME BUILDING SPREAD.  *** OFF. USER-DIRECTED 2026-07-18. ***
# ================================================================================
# WAS ON (2026-07-17) for the shorter 35.85 d number. TURNED OFF 2026-07-18: measured, it is a
# pure makespan<->aging trade with NO effect on how much is produced:
#     ON  : 35.85 d | GT over-24h 64.0% | real demand fulfilled 336,980 / 99.9%
#     OFF : 38.79 d | GT over-24h 55.0% | real demand fulfilled 336,980 / 99.9%  (IDENTICAL)
# Both build every buildable green tyre; EFT only changes WHEN/WHERE. OFF is the more honest
# setting per the standing rule (correctness beats makespan): same 99.9% production, 9 pp fresher
# tyres, and 38.79 d is still fine. The 35.85 was close to the physical floor anyway.
# WAS false (= v6 cap-and-spill FFD, bit for bit). NOW TRUE. A DEVIATION FROM v6, and a
# (C) ALGORITHM -- a NEW rule, not a repair. v6's packer executes exactly as written; we are
# choosing a different rule.
#
# THE DEFECT IT TARGETS -- THE BINDING ONE. MEASURED on the shipped (chrono) state:
#   GT idle delay (actual start - material ready): median 34.6 h, mean 60.6 h, max 310 h,
#     TOTAL 50,433 h. Only 76 of 832 lots (9.1%) start within 1 h of being ready.
#   MEANWHILE building sits 37.7% IDLE (3,418 of 9,075 machine-hours over the same span).
#   mean machines USED per GT code = 1.11, mean ALLOWED by routing = 3.43. 30 of 35 codes
#   use fewer machines than routing permits.
#   => Lots queue 50,433 h while machines idle 3,418 h. The FFD packer opens ONE machine per
#      code and keeps feeding it to the ~545 h fair-share cap. ON = each lot goes to the
#      routing-eligible machine with the EARLIEST FINISH, so a code fans out as far as its
#      volume needs and no further.
#
# MEASURED 2026-07-17 -- controlled A/B, config md5-restored each cell, invariants held in
# every cell (press double-book 0, precedence_neg_gap 0, curing plan IDENTICAL/verbatim):
#   ON THE PRE-CHRONO BASELINE (40.12 d) -- HISTORICAL, superseded:
#     OFF 40.12 d | 197 chg | 3/30 codes >=2 machines || ON 36.98 d | 312 chg | 21/30
#   ON THE SHIPPED (chrono) BASELINE -- THESE ARE THE LIVE NUMBERS:
#     OFF (chrono only)   38.79 d | GT over-24h 55.34% | 197 bld changeovers
#     ON  (chrono + EFT)  35.85 d | GT over-24h 64.25% | 307 bld changeovers
#     ON  + dispatch lft  35.54 d | GT over-24h 63.91% | 307 bld changeovers
#
# !!! THE COST IS REAL AND IT IS AGING. READ THIS BEFORE DEFENDING THE NUMBER. !!!
#   -2.94 d of makespan costs +8.9 pp of GREEN-TYRE OVER-AGE (55.34% -> 64.25%) and +110
#   building changeovers. This VIOLATES the standing rule (correctness beats makespan) on its
#   face; it is shipped ONLY because the user directed it explicitly after being shown the
#   trade twice. It is NOT a free win. wip_netting_chronological (CTP #26) is the free win;
#   this is not.
#   WHY THE TRADE EXISTS (it is not an artifact): building has 37.7% idle it CANNOT SPEND,
#   because the PRESS bank is 88.2% booked. Building faster does not get tyres cured sooner --
#   it gets them BUILT sooner and then they WAIT for a press that is already full, and age.
#   THE PRESS IS THE WALL. Flexibility in building just runs you into it earlier.
#
# WHAT IT DOES NOT FIX:
#   * It does NOT protect sole-eligible codes -- it piles flexible work onto 3409 and DELAYS
#     GT 2618 RAN ATB (the code that starves critical press 4839) from 36.9 h to 45.7 h queue.
#   * At 35.85 d building is NO LONGER the constraint: 89.4% of GT lots are material-late
#     before any machine contention. UPSTREAM COMPONENT SUPPLY binds beyond this point.
#   * It cannot fix rate-mismatch: GT T1457 STAR is cured on 3 presses in parallel but has
#     only 2 routing-eligible TBMs. That is a DATA fix (ask the plant for alt TBMs).
# NOT building_level (that capped daily qty and blew the makespan 36 -> 64 d).
# NOT building_time_phased (measured IDENTICAL 36.98 d, but +26 more changeovers -- redundant).
# See the block comment at BUILDING_SPREAD_EFT in phase5_forward_placement_v2.py.
building_spread_eft:       false
# Sticky band, minutes: among machines finishing within this of the best, prefer the one
# already running this code (no changeover), then least-loaded. Stops EFT shredding
# campaigns into setups for nanosecond gains. Default 40 = the same-size changeover.
# L-8 NOTE (2026-07-27): "40" is NOT "the same-size changeover" anymore -- the real per-TBM same-size
# changeover is 22-28 min (inputs/building_changeover.csv). This band is inert while building_spread_eft
# is OFF; if ever turned ON, set this to ~22-28 to match, else it suppresses beneficial machine switches.
building_spread_eft_sticky_min: 40.0


# ================================================================================
# CTP DEVIATION #32 -- LATENESS-GATED TAIL SPILL  (the "right TBM for the right SKU")
# ================================================================================
# THE DEFECT. Every gate that decides how many TBMs a GT code gets is a MONTH TOTAL with
# NO TIME AXIS:
#   phase5_forward_placement_v2.py:2570  MACHINE_CAP_NS = LOAD_CAP * 1.06 = 608.3 h
#   phase5_forward_placement_v2.py:2864  avail = [m in chosen if machine_load[m] < CAP]
#   phase5_forward_placement_v2.py:2932  m = min(avail, key=machine_load)
# MEASURED on the 2026-06 CTP PCR plan (baseline 34.815 d):
#   TBM 3406 ended the month at 460.4 h -- 147.9 h UNDER the cap -- so the spill at :2865
#   NEVER FIRED. GT1564 NEO (5,926 tyres, SEVEN eligible TBMs) and GT1824 XPC1 (1,378
#   tyres, three eligible) therefore ran their ENTIRE volume on 3406 alone. 3406's month
#   total is low only because it is idle EARLY (10.21 d of its 11.37 d idle is before day
#   20); from day 24 it is back-to-back with six codes and finishes day 32.12, LAST of 11,
#   while 3405 finishes 27.82 with 242 idle hours. Press 4836 starves on it and sets the
#   34.815 d makespan.
#
# WHY NOT JUST SPREAD. building_spread_eft (naive earliest-finish over all eligible TBMs)
# was MEASURED at +16.4 pp of over-24 h green-tyre age, because it pulls all 911 GT lots to
# fresh_floor = LFT - 48 h and every tyre then waits its whole shelf life for a press.
# CORRECTNESS BEATS MAKESPAN -- that is a REJECT. And the phase-4 LFT cannot be the gate
# either: 872 of 911 GT lots already have earliest > due, phase5 prints late-vs-curing 911,
# so "finish > LFT" fires for everything and degenerates back into the naive spread.
#
# THE RULE. A post-assignment, pre-layout REPAIR. Three gates, ALL must pass:
#   1. TAIL     -- only lots finishing within building_tail_spill_tail_h of the BUILDING
#                  makespan. This is a makespan repair, not a load balancer.
#   2. LATENESS -- only lots the MACHINE kept waiting (start - ready) longer than
#                  building_tail_spill_tol_h. `ready` = max(kit_ready, fresh_floor, T0,
#                  material_ready). A lot waiting on MATERIAL is never moved.
#   3. MAKESPAN -- accepted only if it strictly cuts max(end(donor), end(receiver)) by
#                  >= building_tail_spill_min_gain_h, i.e. the receiver is genuinely idle
#                  at that instant. Deterministic tie-break on machine id.
# AGING GUARD (pin_starts): every NON-moved lot keeps its pre-repair start as a FLOOR, so
# emptying the donor can never pull another green tyre EARLIER (= older at the press).
# Moved lots are still floored at `earliest`, so NO tyre is ever built before its freshness
# floor. Every move is written to outputs2/phase5_tbm_spill_moves.csv with the gate values
# that admitted it -- the schedule stays explainable lot by lot.
#
# Bounded by ROUTING eligibility only -- it can never put a code on a TBM the plant's
# routing does not allow. Set building_tail_spill_rounds: 0 to prove the OFF-equivalence.
#
# REVERT PATH (documented 2026-07-24):
#   1-line revert : building_tail_spill: false  -> phase5 is bit-identical to the
#                   pre-change run (VERIFIED twice: 34.815 d / 47.08 % >24 h /
#                   18.82 % >48 h / 21.60 h median / cured 385,772 / 7018-193-62).
#   full revert   : copy _tbm_exp/phase5_forward_placement_v2.py.BASELINE over
#                   ctp_v6_v2/phases/phase5_forward_placement_v2.py and
#                   _tbm_exp/config.yaml.BASELINE over ctp_v6_v2/config.yaml.
#   SHIPPED RESULT: 33.349 d | >24 h 46.48 % | >48 h 18.58 % | median 21.27 h
#                   | cured 385,772 | kit READY 7018 / SHORT 193 / UNKNOWN 62
#                   | +8 building changeovers (363 -> 371) -- the only cost.
building_tail_spill:            true
# RULE A (machine-end shortening) -- MEASURED STRICTLY DOMINATED by rule B on this plan:
#   A only  34.143 d / 47.49 % >24 h / 19.12 % >48 h
#   A + B   33.375 d / 46.85 % / 18.79 %
#   B only  33.349 d / 46.48 % / 18.58 %   <- SHIPPED
# Kept and defaulted OFF; enable only if a future mix has a machine-end tail rule B's
# idle-absorption cannot reach.
building_tail_spill_tail_rule:  false
building_tail_spill_rounds:     12
building_tail_spill_tail_h:     120.0
building_tail_spill_tol_h:      8.0
building_tail_spill_min_gain_h: 1.0
building_tail_spill_pin_starts: true
# JIT LANDING. After a move is accepted, binary-search the LATEST start the receiver can
# give the moved lot while the pair-end stays at the value that justified the move.
# MEASURED: OFF -> 34.143 d but over-24 h 47.08 -> 47.83 % (REJECTED under CORRECTNESS
# BEATS MAKESPAN). The moved tyre was being built as early as the receiver allowed and
# then waiting for its press. Keep ON.
building_tail_spill_jit_landing: true
# RULE B -- IDLE-ABSORPTION PULL-FORWARD. Rule A can only shorten a machine's END, so a
# MID-QUEUE lot that starves a press mid-horizon is invisible to it. MEASURED:
# GT1824 XPC1_L0006 is kit-ready day 24.98 (material_ready is EMPTY for ALL 911 GT lots --
# the wait is 100% machine queue) and 3406 starts it day 28.30; press 4836 idles 1.739 d
# waiting for it. Rule B moves such a lot ONLY into genuine idle on an eligible machine:
# no other lot may be delayed (pull_harm_h = 0), the building makespan may not grow, and
# the lot lands as LATE as the minimum gain allows -- never "as early as possible".
building_tail_spill_pull_forward:    true
building_tail_spill_pull_tol_h:      48.0
building_tail_spill_pull_min_gain_h: 12.0
building_tail_spill_pull_harm_h:     0.0
# AGING CAP (h): the most a rule-B move may pull a green tyre FORWARD. 0 = uncapped.
# MEASURED uncapped: over-48 h 18.82 -> 19.20 % and every newly-over-48 tyre traced to
# four big pulls (GT 1634 XPC TATA 78 h/64 h, GT 1894 MAX 55 h, GT 1482 UHL 41 h), while
# the move that bought the makespan (GT1824 XPC1_L0006) needed only 38 h.
building_tail_spill_pull_max_h:      0.0    # 0 = uncapped; the last_need ROPE below subsumes it (MEASURED: cap 24/40 h is strictly worse on BOTH axes)
# THE ROPE. Use phase2's last_need (the LAST curing block that consumes the lot) as the
# drum signal instead of the phase4 LFT. MEASURED over the 911 GT lots:
#   median(last_need - phase4 LFT) = +41.5 h ; median(build start - last_need) = +13.2 h.
# The LFT calls all 911 lots late (phase5 prints late-vs-curing: 911) so it cannot gate
# anything; last_need dates them sanely. With this ON a moved lot may be pulled forward
# only as far as last_need - dur -- i.e. up to the press's own need time and NO FURTHER.
# That is the difference between a ROPE and a SPREAD.
building_tail_spill_use_last_need:   true

# ================================================================================
# CTP DEVIATION #36 -- QUEUE-WAIT TRIGGER (G1), NEED-BOUNDED DISPLACEMENT (G2),
#                     HEAD-LOT CONTENTION FIX (G3).      ALL DEFAULT OFF.
# ================================================================================
# WHAT CTP #32 STILL MISSES, MEASURED ON THE SHIPPED 33.315 d RUN
#   press 4836 (critical) = 2.196 d late start + 1.544 d internal idle + 29.574 d work.
#   plan.csv starts ALL 86 presses at T0+0.00 h -- BOTH losses are the scheduler's.
#
#   CASE A (the 2.196 d).  4836's first block is SKU 1325222416098VURL0 = GT 2256 ROYL.
#     GT 2256 ROYL_L0001: earliest 36.94 h, due -1.50 h, last_need 32.0 h, BUILT 51.22 h.
#     ~37 h of that is a HARD component floor (cap strip on slitter 702, 97 % busy).
#     The other 14.28 h is pure CONTENTION: TBM 3401 was 93 % busy on GT 2157 ROYL KIA
#     while GT 2256 ROYL had SIX eligible TBMs. Rule B never saw it -- 14.28 h <= its
#     48 h queue gate AND 24.5 h <= its 48 h drum gate. -> G3.
#
#   CASE B (the 1.544 d).  All three internal gaps on 4836 wait on GT1824 XPC1.
#     GT1824 XPC1_L0001: earliest 404.33 h, due 428.22 h, last_need 429.72 h,
#     BUILT 492.37 h = 88.03 h of pure machine queue and 62.65 h past its own need,
#     while TBM 3406 was ~50 % idle in the window. It IS a rule-B candidate (both 48 h
#     gates pass) -- it was refused at the DISPLACEMENT gate. -> G2.
#     (Root cause proven with building_tail_spill_debug: true ->
#      outputs2/phase5_tbm_pullB_debug.csv)
#
# G1 -- the two rule-B admission gates, split out of the single 48 h _pull_tol_h.
#       0 = fall back to building_tail_spill_pull_tol_h => CTP #32 EXACTLY.
building_tail_spill_pull_queue_h:    0      # min (start - max(earliest, material_ready))
building_tail_spill_pull_drum_h:     0      # min (finish - last_need)
# G2 -- how far a lot ALREADY ON the receiver may be displaced by the insert.
#       strict     : not at all (CTP #32). "There is a real idle window here."
#       last_need  : it may finish later, but ONLY inside its OWN last_need. We spend a
#                    neighbour's DRUM SLACK, never its need time. Still a rope, and a
#                    displaced tyre is built LATER = FRESHER, not older.
building_tail_spill_pull_harm_mode:  strict
# G3 -- HEAD-LOT CONTENTION FIX. Reuses rule B's trial-placer verbatim (so the receiver-end
#       guard, the last_need rope and the displacement gate all still apply) with gates
#       re-sized for the start of the horizon. REQUIRES building_tail_spill_pull_forward.
building_tail_spill_head_fix:        false
building_tail_spill_head_window_h:   168.0  # H1: lot must FINISH inside this from T0
building_tail_spill_head_tol_h:      4.0    # H3a: min queue wait to be a candidate
building_tail_spill_head_min_gain_h: 2.0    # H3b: min hours pulled forward
# RULE D -- SAME-MACHINE CAMPAIGN RESEQUENCE. The move rules A/B/C structurally cannot make:
# they all REASSIGN a lot to a different TBM (`if _m2 == _m: continue`), but the layout key
# (due_day, ITEM CODE, due, lot_id) is GLOBAL, so all 11 TBMs walk the due_day axis in
# lockstep and a lot lands at nearly the same wall-clock time whichever machine it is on.
# MEASURED with building_tail_spill_debug: 441 of 584 head probes and BOTH case-B probes
# were refused at gate (i) "no gain" -- the receiver was no earlier. The wait is in the
# wrong PLACE IN THE QUEUE, not on the wrong machine.
# Rule D promotes a whole item-code CAMPAIGN inside its own machine queue. Moving a maximal
# run to a run boundary cannot increase the changeover count (asserted every trial), the
# machine end may not grow, and every displaced lot must still finish inside its own
# last_need (requires building_tail_spill_pull_harm_mode: last_need to displace anything at
# all). Promotion is MINIMAL (latest workable slot) and JIT-landed (as late as the hole
# allows = as fresh as possible).
# ================================================================================
# CTP DEVIATION #40 (T2) -- RULE E: SAME-MACHINE SINGLE-LOT PULL-FORWARD.  OFF.
# ================================================================================
# Rules A/B/C are all machine REASSIGNMENTS (`if _m2 == _m: continue`), so a lot
# can never be pulled earlier ON ITS OWN MACHINE. Rule D can, but only as a whole
# item-code CAMPAIGN. Rule E is the missing single-lot case: reposition ONE late,
# queue-bound lot into a genuine idle window on the machine it is already on,
# keeping the CTP #32 rope (start >= last_need - dur), the idle-absorption test
# and, unlike F2, an explicit CHANGEOVER-MAY-NOT-GROW guard.
building_tail_spill_same_machine: false   
building_tail_spill_same_machine_queue_h:  8.0    # E1 min queue wait to be a candidate
building_tail_spill_same_machine_drum_h:   0.0    # E2 min hours past its own last_need
building_tail_spill_same_machine_gain_h:   2.0    # (i) min hours pulled forward
building_tail_spill_same_machine_co_guard: true   # E5 machine CO count may not grow

building_tail_spill_reseq:           false
building_tail_spill_reseq_tol_h:     8.0    # D1: campaign must be this far past its last_need
building_tail_spill_reseq_gain_h:    2.0    # min hours of lateness the promotion must remove
# AUDIT -- per-candidate / per-target rejection census -> outputs2/phase5_tbm_pullB_debug.csv
building_tail_spill_debug:           false


# ================================================================================
# CTP DEVIATION #37 -- DRUM PRIORITY (H1 / H2).            *** DEFAULT OFF. ***
# ================================================================================
# THE PREMISE, measured on inputs/plan.csv (reproduce: _drum_exp/premise.py):
#   63 of 86 presses are booked >= 99.5 % of the 720 h horizon. A press with ZERO slack
#   cannot recover from starvation -- any idle goes straight to the makespan; a press
#   with slack absorbs it. ALL 10 of the latest-finishing presses are in that group.
#   In the shipped 33.315 d run those 63 lose 920 h of late start + 2,674 h of internal
#   idle (mean late start 14.60 h, mean total idle 57.05 h) while the 23 presses WITH
#   slack finish on average day 24.84 -- about 8 days early.
#
# THE SIGNAL: press slack = 720 h - hours plan.csv books on that press INCLUDING its
#   CHANGEOVER shifts. A lot's criticality = the MINIMUM slack over the presses that
#   consume it, joined block_id -> pressNo exactly the way phase1b numbers blocks
#   (phase1b_demand_explosion.py:161). Coverage 364,919 / 364,919 lot-block rows.
#
# DEGENERACY (measured, _drum_exp/degeneracy.py -- do not skip this check):
#   press slack 38 distinct values, 20 presses at exactly 0.00; lot criticality 24
#   distinct values with a 53.2 % largest class. It reorders GT codes on 30 of 30
#   due_days and discriminates 205 of 273 dispatch tie-groups. Real key, coarse by
#   design -- the coarseness is what keeps campaigns whole.
#
#   off  -- no term added anywhere; both key expressions are the v6 literals (bit-exact).
#   gt   -- H1. Only GREEN TYRES lots are scored; everything else takes the neutral 0.0.
#   all  -- H2. Every lot is scored, so the drum signal propagates to the components.
#           This is the one that reaches extruder 1002 / sidewall 1001, whose heads are
#           a SINGLE tie-group decided by item-code ASCII (TRD 1402 ... TRD 2776 all run
#           before TRD T1457 STAR because "T" sorts after every digit; measured 47.18 h
#           start, queue position 25 of 266, 44.25 h after its compound was ready).
drum_priority:              off     # off | gt | all
# 0 = use the raw slack hours. >0 = bucket into bands of this width (coarser = fewer
# reorderings = safer for changeovers). 3.6 makes it binary drum / not-drum.
drum_priority_band_h:       0.0
drum_priority_layout:       true    # apply to the BUILDING layout key (per-CODE min)
drum_priority_dispatch:     true    # apply to the TOPOLOGICAL dispatch key (per-LOT)
drum_priority_horizon_h:    720.0   # the plan horizon slack is measured against
# HOW A PRESS IS SCORED before the per-lot MIN is taken.
#   slack     -- 720 h - plan booking. Non-circular but MEASURED DEGENERATE AT THE TOP:
#                20 of 86 presses are booked to exactly 720.00 h, so the most-critical
#                class is a 20-way tie and press 4836 -- the one that actually SETS the
#                33.315 d makespan -- is booked 719.78 h and therefore ranks BEHIND all
#                twenty. That is why the layout leg improves 11 of the top 12 presses
#                and still loses 0.500 d: it de-prioritises the critical press.
#   press_end -- minus the press's observed END TIME in the run snapshotted at
#                drum_priority_feedback_dir. One predictive-reactive feedback pass;
#                45 distinct scores, largest class 9.9 %.
drum_priority_rank:         slack   # slack | press_end
drum_priority_feedback_dir: ""      # required for rank=press_end, e.g. _drum_exp/outputs2_BASELINE
# NOTE: incompatible with building_tail_spill_reseq (rule D) -- phase5 aborts if both
# are on, because rule D's layout override assumes the 4-slot CTP #35 key.


# ================================================================================
# CTP DEVIATION #26 -- CHRONOLOGICAL WIP NETTING.  *** ON. USER-DIRECTED 2026-07-17. ***
# ================================================================================
# WAS: false ("REVERTED to v6 (pro-rata smear)"). NOW TRUE. This is a DEVIATION FROM v6.
#
# WHAT v6 DID (the smear) AND WHY IT IS WRONG. Opening WIP is the ONLY way physical floor
# stock enters this model -- phase5's _material_ready_ns (:1708) counts ONLY predecessors
# `in schedule` (i.e. lots PRODUCED this month); opening stock is NEVER a term in it. So HOW
# phase1c distributes the netting IS the whole ballgame. v6 spread each item's saving EVENLY
# across every in-window demand row, so stock PHYSICALLY ON THE FLOOR AT t=0 was rationed
# across the item's whole aging window instead of covering the demand due FIRST.
# The code's own measured example (see the block comment at phase1c_mrp_netting.py:526):
#     IL5 WIP on floor at t=0     : 3,729 kg
#     IL5 GROSS demand, first 24 h: 2,479 kg   <- floor stock covers this OUTRIGHT
#     pro-rata ratio              : 0.6188
#   => the first 24 h was netted only 38%, 1,534 kg SURVIVED, and A MIXING LOT WAS CREATED
#      THAT OCCUPIED A MIXER AT HOUR 0 AND GATED THE FIRST GREEN TYRE -- TO MAKE COMPOUND
#      THE PLANT ALREADY HAD. Same shape: S53 (0.379), T15 (0.730), PCRT15 (0.654), B278 (0.639).
#
# ON = consume the saving CHRONOLOGICALLY, earliest need_by first (the ordinary MRP rule).
#
# INVARIANT (verified in the run log, both modes): the two modes remove the IDENTICAL TOTAL
# -- 2,577,439 units. ONLY WHICH ROWS are netted changes. The cascade, the shelf-life window
# and WHICH rows are eligible are all untouched. It costs NOTHING in material terms: the
# stock is already on the floor.
#
# MEASURED 2026-07-17 -- matched A/B, both cells `--from phase1c --force`, config restored to
# a verified md5 after each run, and the result REPRODUCED twice on separate runs:
#     OFF (v6 smear)   40.12 d | GT over-24h 57.77% | 197 bld chg | curing plan REFERENCE
#     ON               38.79 d | GT over-24h 55.34% | 197 bld chg | curing plan IDENTICAL
#   Also: first material day 2.68 -> 1.32 | building first start 2.72 -> 1.32
#         material-late median 47.5 h -> 22.6 h | all invariants hold | press double-book 0
#
# WHY THIS ONE IS SAFE WHERE OTHER LEVERS ARE NOT: it is the ONLY lever measured that improves
# makespan AND AGING TOGETHER (-1.33 d and -2.43pp over-age), at ZERO extra changeovers, with
# the curing plan byte-identical. Every other lever trades aging for days:
#     building_spread_eft  36.98 d but over-age 62.58%
#     best_press_curing: the "41.27 d (LOSES)" here is STALE -- measured on the OLD 40.12 baseline
#       (phase6-only, stale upstream). On the CURRENT shipped state (chrono+eft+cascade) an offline
#       bit-exact replay of best_press_reassign gives 32.69 d (FASTER, -3.16 d, all scheduling
#       invariants valid). It is DISQUALIFIED ON AGING, not makespan: GT over-age 64.0% -> 97.9%
#       (green age median 35 h -> 146 h). The makespan gain IS the aging loss. Do not quote 41.27.
# Per the standing rule (correctness beats makespan) this is closer to a DEFECT FIX than a
# policy choice -- it stops the model disbelieving stock the plant physically has.
#
# NOTE -- COUPLING: the 2026-07-17 aging_master edit (GT max age 24 -> 48 h) AMPLIFIES the
# smear, because phase1c uses max_h as the netting window (`is_in_window`, :486): doubling
# GT max_h doubles the rows the smear divides across, thinning every early row further.
# Chronological removes that coupling entirely.
# USER DIRECTIVE 2026-07-22: phase1c must match v6_wave_p2's algorithm EXACTLY (see the
# header of phases/phase1c_mrp_netting.py). v6 has NO chronological path -- it always
# applies the pro-rata SMEAR. This flag is therefore now INERT (phase1c no longer reads
# it) and is pinned false so config states the truth: the smear is in force, as in v6.
wip_netting_chronological: false

# ================================================================================
# CTP DEVIATION #28 -- CONVERGENCE LOOP: build against the press time the press HAS
# ================================================================================
# DEFAULT OFF = today's behaviour, bit for bit.
#
# THE DEFECT this closes. phase4/phase5 aim every green tyre at the press start time
# in plan.csv. phase6 then re-times the press -- MEASURED: 6,309 of 6,975 blocks slide
# LATER, median 49.5 h, max 80.3 h -- and phase6 is the LAST phase, so building is
# never told. The green tyre is therefore built ~2 days before the press can take it.
#   MEASURED at the baseline (schedule_open_h 0):
#     green-tyre age at the press: median 45.6 h | p90 72.3 h | worst 103.0 h
#     75.5% of tyres cured past their 24 h shelf life
#     17,104 green tyres standing on the floor (time-weighted). Little's Law closes:
#       17,104 tyres / 425.3 tyres-per-h = 40.2 h  ==  the measured mean age.
#
# WHAT IT DOES. Re-runs phase4 -> phase5 -> phase6 with `need_by` replaced by phase6's
# OWN revised press start times, until those times stop moving. It changes NO RULE in
# any phase -- it re-runs the same machinery against a corrected input. phase6 always
# re-reads plan.csv for orig_start, so the press can never be pulled EARLIER than plan.
#
# COST: one extra phase4+phase5+phase6 pass per iteration (~60 s each).


dispatch_priority: lft   # 2026-08-02: order by DEADLINE (make required-soonest first) so day-1 kit is built before later-day kit
resync_chain_mode: false   # v6 default

# ================================================================================
# CTP DEVIATION #39 (T1) -- `mhe_index` IN THE DISPATCH KEY.       DEFAULT v6.
# ================================================================================
# Slot 2 of the topological dispatch key, ABOVE first_need (slot 3).
# Its stated purpose is ANTI-MONOPOLY across SUB-DRUMS of one lot. There are no
# sub-drums on CTP: MEASURED mhe_total == 1 on 8,070 of 8,070 lots. phase2 still
# writes mhe_index as a within-item SEQUENCE number, 0..13, non-zero on 787 lots.
# So slot 2 currently orders lots by "how many earlier lots of my own item exist"
# ABOVE the hour they are needed: 204,845 inverted ordered pairs, 5,183 of 8,070
# lots (64.2%) dispatch ahead of an earlier-needed lot, and 117 of 911 GT lots have
# a binding component at mhe_index >= 1.
#   v6      slot 2, as shipped (DEFAULT -- provably byte-identical to the old key)
#   off     dropped entirely
#   demote  moved BELOW first_need (keeps its interleaving, loses its veto on dates)
dispatch_mhe_index: demote   # 2026-08-02: demote mhe_index BELOW first_need (CTP #39) so components dispatch by NEED, not within-item sequence

# ================================================================================
# CTP DEVIATION #38 (J1/J2/J3) -- DISPATCH TIE-BREAK ONLY.        DEFAULT OFF.
# ================================================================================
# Reorders ONLY lots that are ALREADY TIED on (wave_first, mhe_index, first_need).
# Slot 4 of the dispatch key, behind all three v6 keys, ahead of item_code. Nothing
# that DIFFERS on first_need can move. Full write-up + all measurements at
# phase5_forward_placement_v2.py:1180.  Mutually exclusive with dispatch_priority
# (non-item_code) and with drum_priority's dispatch leg -- phase5 aborts loudly.
#
# WHY: 7,892 of 8,070 lots (97.8%) sit in a multi-lot tie group, largest 350. On the
# tread extruder 266 lots have 35 distinct first_need; 26 share 2026-06-01 07:00 and
# the ALPHABET orders them, putting TRD 2256 ROYL 19th because "2256" > "1402" as
# TEXT. It gates press 4836 (the critical press). All the work ahead of it is in the
# SAME tie group -- 27.88 h reorderable, 0.00 h frozen (_tie_exp/headroom.py).
#
#   off        v6, bit-for-bit. The alphabet.
#   last_need  J1 as literally specified (phase2 last_need, the CTP #32 rope signal).
#              MEASURED A NO-OP ON THE TRACED LOTS: 3 distinct values in the cold
#              group, 24 of 26 tread lots share the latest, TRD 2256 ROYL 202 -> 202.
#   seed       J3, surgical: the 25 component codes of the first kits of the 26
#              presses finishing within 1.0 d of critical go first inside their tie
#              group. scope=cold moves exactly 26 lots inside one 212-lot group.
#   press_end  minus the observed end of the LATEST press the lot feeds, from a
#              PREVIOUS run's snapshot. Strongest key measured (splits 250/273 groups,
#              traced lots to rank 2-14 of 210). !! scope=all is ARITHMETICALLY the
#              same as CTP #37's REJECTED FB_disp (34.280 d). Only scope=cold is new.
tie_break:              off        # off | last_need | seed | press_end
tie_break_scope:        cold       # cold (earliest first_need group only) | all
tie_break_seed_file:    _wip_audit/CRITICAL_PRESS_SEED_LIST.csv
tie_break_feedback_dir: _tie_exp/outputs2_BASELINE   # snapshot dir, NEVER live outputs2

# ================================================================================
# CTP DEVIATION #30 -- MPQ OVER-PRODUCTION DOES NOT CASCADE DOWN THE BOM
# ================================================================================
# FOUND BY THE USER, BY EYE, from two totals in the floor schedule -- after the pipeline
# printed "all_invariants_hold: YES". Every automated gate passed.
#
# THE DEFECT: phase1b explodes the BOM from DEMAND. phase2 then applies the MPQ floor PER
# ITEM, INDEPENDENTLY (`lot_qty_full = max(raw_qty, mpq_min)`), with NO feedback to children.
# Both sides are locally correct. They never talk. So a parent rounded up to its MPQ floor
# creates demand its children were never told about.
#   MEASURED (shipped 35.85 d baseline): 53 items short, 124,485 units uncovered.
#     Bead Bundle      73,023 (25 items)   <- "you cannot apex a bead you never wound"
#     CALANDARED ROLL  34,185 ( 5 items)   <- from Ply
#     FINAL COMPOUND   16,402 (18 items)
#   Bead chain: apex MADE 828,526 (+10.3% MPQ round-up; 40.3% of buckets AT the 400 floor)
#   vs bundles MADE 732,861 + usable WIP 21,641 = 754,502.  74,024 apexes have NO BEAD.
#   ROOT: SUB_WAVE_BUCKET_H_SHORT = 12.0 (phase2). Apex max_aging 24h < 48h threshold -> 12h
#   sub-buckets -> median raw 512, 40.3% below the 400 floor. Bundle max_aging 48h is NOT
#   < 48h -> no sub-bucketing -> median raw 2,913, only 6.7% below floor. 400 pieces is ~14h
#   of apex demand -- LARGER than the 12h bucket it must fit in. THAT asymmetry is the defect.
#   Do NOT just widen the bucket: apex dies in 24h, so a wider bucket trades over-production
#   for expiry 1-for-1.
#
# mpq_balance_gate: the balance REPORT always runs (writes phase2_bom_shortfall.csv).
#   true = STOP the run on any uncovered child. Turn on once you have seen a clean run.
mpq_balance_gate:        false
# mpq_cascade_to_children: true = derive child demand from parent MADE, not parent DEMAND,
#   iterated to a fixpoint. PROVABLY CANNOT EXPLODE (max(raw,mpq) is monotone + 1-Lipschitz
#   on an acyclic BOM: 495/495 items, 0 cycles) and is SELF-DAMPING (cascaded demand pushes
#   buckets ABOVE their floors, so total MPQ surplus FALLS 169,334 -> 167,598 even as
#   production rises +132,128 = +0.46%). Converges in 2 passes, measured.
#   COST: +62.3 h of 12,103 h. Bead Bundle +75,860 (+42.9 h on 1201, a SINGLE winder:
#   62.2% -> 68.2% true util, 238.6 h idle within its used days); CALANDARED ROLL +37,781
#   (+15.6 h). BUILDING -- THE CONSTRAINT -- GETS +0.00 h (Green Tyres has NO MPQ and is the
#   parent of every inflating item, so nothing cascades into it). 0 new lots => 0 new
#   changeovers. THE PLAN GETS LONGER. That is the correct answer -- the material is not there.
#
# ANSWERED 2026-07-17, USER-DIRECTED -- THE QUESTION THAT DECIDED THIS FIX:
#   Q: "Bead apex minimum run is 400 Nos. If only 250 are needed, does the machine PHYSICALLY
#       PRODUCE 400 apexes (consuming 400 bundles), or produce 250 and just HOLD THE LINE for
#       the minimum run time?"
#   A: "PRODUCE 400 apexes. It should follow the MPQ file."   <-- MPQ IS PIECES, NOT TIME.
# So a floored apex run really does consume 400 bead bundles, the material balance is real,
# and the cascade is the CORRECT fix. (Had the answer been TIME, this would be VOID: lot_qty
# would stay 250, only duration_min would reflect the floor, and the shortfall would vanish
# with zero extra winding.) => TURNED ON.
#
# !! WHAT REMAINS UNRESOLVED, AND IT IS A REAL COST -- DO NOT LET THIS BE FORGOTTEN:
# !! Bead Apex MaxAging is 24 h (cut 72 -> 24 by the UNSIGNED 2026-07-16 23:23 upload). So the
# !! ~77,596 surplus apexes CANNOT go to stock -- this cascade now winds ~73,023 REAL bead
# !! bundles to make apexes that EXPIRE BEFORE USE. Apex already carries 1,695 expiry
# !! violations (2nd worst item type in the plant, 66.6% of its lots). That is now CORRECT and
# !! DELIBERATELY WASTEFUL: the plan is executable and it plans scrap.
# !! THE ROOT IS NOT THE MPQ -- it is SUB_WAVE_BUCKET_H_SHORT = 12.0 (phase2). Apex max_aging
# !! 24h < the 48h threshold -> 12h sub-buckets -> median raw 512, 40.3% below the 400 floor.
# !! Bundle max_aging 48h is NOT < 48h -> no sub-bucketing -> median raw 2,913, 6.7% below.
# !! 400 pieces is ~14h of apex demand -- LARGER than the 12h bucket it must fit in.
# !! Widening the bucket is NOT free: apex dies in 24h, so it trades over-production for
# !! expiry 1-for-1. THE REAL FIX IS TO CONFIRM OR REJECT THE 24h WITH THE PLANT.
# USER-DIRECTED 2026-07-23: REVERT CTP #30 TO v6. v6 has NO MPQ cascade and NO material
# balance (both features are entirely absent from v6_wave_p2/phases/phase2_lot_sizing.py).
# Set to false so phase2 lots are v6 BIT-FOR-BIT (the code's own designed off-switch).
# ACCEPTED COST (same class as the phase1c v6-revert): reintroduces the material imbalance
# this fix closed -- ~124,485 units across 53 items where a parent is rounded UP to its MPQ
# floor but its children are NOT built to match (phantom production). ZERO makespan change.
# To restore the fix, set both flags below back to true.
mpq_cascade_to_children: false           # v2: OFF under building-echo (per-shift blocks -> cascade explodes compound 80x)
mpq_material_balance_report: true       # #30 material-balance report OFF = v6 (v6 has no such check)
mpq_cascade_max_passes:  40   # inert while cascade is off (kept for easy restore)

# ================================================================================
# CTP #33 / #34 / #35 -- THE MATERIAL-GATE FLOW FIXES (F1 / F3 / F2)
# ================================================================================
# BACKUPS + REVERT PATH (2026-07-24):
#   _flow_exp/phase3_dag_construction.py.BASELINE   -> ctp_v6_v2/phases/
#   _flow_exp/phase5_forward_placement_v2.py.BASELINE -> ctp_v6_v2/phases/
#   _flow_exp/config.yaml.BASELINE                  -> ctp_v6_v2/config.yaml
#   _flow_exp/inventory.csv.BASELINE                -> ctp_v6_v2/inputs/inventory.csv
#   1-line revert: set the three flags below to false (VERIFIED bit-identical to the
#   CTP #32 shipped run: 33.349 d / 46.48 % >24 h / 18.58 % >48 h / 21.27 h median /
#   cured 385,772 / kit 7018-193-62).
#
# MEASURED 2026-07-24, matched A/B, every cell run `--from phase1c`, all-OFF re-verified
# BIT-IDENTICAL (md5 of phase3/4/5/6 outputs) BEFORE and AFTER every edit:
#
#   variant           makespan  >24h    >48h    med    1st GT  bld CO  compFEFO(ex-cap)
#   A0 baseline (#32)  33.349 d 46.48%  18.58%  21.27h  37.68h   371     94.25% (59.33%)
#   B1 F1              33.315   44.83   18.39   20.06   11.68    370     92.87  (57.18)
#   C1 F1+F2("lot")    34.261   32.12   13.20   11.27   14.66    763     94.63  (66.62)
#   C2 F1+F2("family") 34.271   51.29   22.12   25.41   14.66    361     92.81  (53.91)
#   D1 F1+F2+F3        34.261   31.34   12.42   10.56    5.56    763     94.40  (65.75)
#   E1 F1+F2+F3+F4     34.261   30.60   12.05   10.31    2.73    763     93.42  (65.26)
#   D2 F1+F3           33.315   43.30   17.02   19.75   11.14    370     92.85  (56.84)
#   E2 F1+F3+F4        33.315   43.22   16.93   19.52   11.14    370     91.97  (56.74)
#   cured = 385,772 and kit 7018/193/62 in EVERY cell. Building work 6,312.6 h everywhere.
#
# ---- CTP #33 (F1) -- PER-EDGE CONSUMPTION QUANTITY.  *** ON. ***  ---------------
# phase3's edge carries no quantity, so phase5's material gate can only form `need` as
# the SUM of the consumer's BOUND PREDECESSOR LOT QUANTITIES. MEASURED on the shipped
# run that is 787,917,887 units against a TRUE BOM consumption of 27,415,139 -- 28.7x.
# Arithmetically it makes the gate identical to "wait for EVERY predecessor lot".
# ON: phase3 emits `consume_qty` (FEFO allocation of the TRUE per-parent-unit rate taken
# from phase1_demand_updated.csv.gz) and phase5 uses need = SUM(consume_qty). The edge
# SET is UNCHANGED -- VERIFIED: phase4_lot_times md5 IDENTICAL, so every LFT, degree and
# depth is bit-identical; only the material gate's arithmetic changes.
# MEASURED ALONE: -0.034 d, GT over-24h -1.65 pp, over-48h -0.19 pp, median -1.21 h,
#   component FEFO -1.38 pp, first green tyre 37.68 -> 11.68 h, cured/kit UNCHANGED,
#   ALLOCATED negative-gap edges 0 (all 130 negative gaps sit on consume_qty=0
#   compatibility links), MATERIAL STARVATION 0. It improves every axis.
edge_consume_qty:            true
#
# ---- CTP #35 (F2) -- ORDER THE BUILDING QUEUE BY NEED, NOT BY NAME. *** REJECTED ***
# The per-machine layout key is (due_day, ITEM CODE, due, lot_id): inside a due-day
# bucket a STRING decides the priority. Two modes were built and BOTH ARE REJECTED:
#   "lot"    (the literal fix, (due_day, last_need, due, code, lot_id)) --
#            GT over-24h 44.83 -> 32.12 % (much better) BUT component FEFO ex-cap-strip
#            57.18 -> 66.62 % (WORSE), makespan 33.315 -> 34.261 d, building changeovers
#            370 -> 763 (+393, ~+262 h). `code` was ALSO the campaign key.
#   "family" (order the CODES by their earliest last_need, keep each code as one
#            campaign) -- changeovers 370 -> 361 (BETTER) and component FEFO ex-cap
#            57.18 -> 53.91 % (BETTER) BUT GT over-24h 44.83 -> 51.29 % (WORSE) and
#            makespan 34.271 d.
# Both RAISE an aging axis and both cost ~0.95 d => REJECTED under the standing rule.
# What they show is that GT age and COMPONENT age are a CONSERVED PAIR here:
# re-ordering building MOVES rot between them, it does not remove it.
# Accepts false / "lot" / "family".
building_order_by_need:      false
#
# ---- CTP #34 (F3) -- SEED OPENING COMPONENT WIP INTO THE phase5 GATE. *** ON. ***
# _material_ready_ns counts only predecessors `in schedule` (produced THIS month).
# Opening component stock -- which phase1c has ALREADY netted out of the demand, so it
# is never produced -- was invisible. This is the component analogue of phase6's
# seed_kitpool_from_inventory (green tyres, live since 2026-07-16).
# !! REQUIRES edge_consume_qty. phase5 REFUSES to seed against the v6 lot-sum need and
#    says so, because that WOULD be a double count.
# THE NO-DOUBLE-COUNT PROOF, printed every run and reproduced here (2026-07-24):
#    true need 27,415,139 | production 27,341,528 | opening 1,554,707
#    items covered 350/427 | REAL SHORTAGE 647,578 units over 77 items (2.4% of need;
#    those items keep the old strict-precedence behaviour and are listed by name).
#    Per item the identity is  need == production + opening  -- e.g.
#    TRD 1513 XPC1 MSIL: need 92,247.3 = produced 91,104.0 + opening 1,143.0.
# MEASURED (on top of F1): GT over-24h 44.83 -> 43.30 %, over-48h 18.39 -> 17.02 %,
#   median 20.06 -> 19.75 h, component FEFO 92.87 -> 92.85 % (ex-cap 57.18 -> 56.84),
#   makespan unchanged, cured/kit unchanged, MATERIAL STARVATION 0.
# NOTE: F3 credits the plant's stock the SAME way phase1c already did -- against ALL of
# it, with no expiry filter (phase1c reverted #25 to v6 on 2026-07-22). If phase1c ever
# starts age-filtering the WIP, this must follow it or the two will disagree.
seed_component_wip_phase5:   true

# ---- F4 -- CAP STRIP + MOTHER ROLL ASSUMED AVAILABLE. *** NOT APPLIED. ***  -----
