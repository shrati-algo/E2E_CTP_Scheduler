kit_gate_assume_first_h:            # v79 (user 2026-10-12): for build rows PLANNED in the first `hours` of the plan, cap strip,
  enabled: true                     # edge gum, edge strip and steel belt edge strip are assumed present (not gated, not drawn);
  hours: 24                         # v116 (user 2026-10-14): cap strip + edge gum available the whole first day; v85-v98 = 8 h (A shift). v116b TESTED 8 h: same total (124,996), day 1 worse
  item_types: ["Cap Strip"]         # v85: Cap Strip + Edge Gum only; Edge Strip / Steel Belt Edge Strip / BEF checked against stock
  patterns: ["CAPSTRIP", "^CAP 66-MOTHERROLL$", "^EG0[0-9]$", "^EGSL", "^TEG-0[0-9]$"]   # v120: + mother roll (building takes it directly with capstrip_direct)   # edge gum EG0x / EGSL0x / TEG (item master types them Steel Belt Edge Strip)
  # codes_file: ctb_untracked_codes.csv   # v85: OFF -- untracked codes / types count as zero on the floor (assumption.md "removed")
ctb_wip_assumptions:                # v80 (user 2026-10-12): the plan generator's WIP assumptions (CTB_WIP_ASSUMPTIONS_v2.xlsx)
  enabled: true                     # #11 expired opening stock usable expired_usable_h from t0; #2 flow_hours of measured
  file: CTB_WIP_ASSUMPTIONS_v2.xlsx # upstream flow (sheet 5) added as stock at t0; #1 untracked building components (sheet 6b)
  expired_usable_h: 0               # v85: 0 = no expired-stock assumption (assumption.md: only Cap Strip + Edge Gum assumed as stock); was 24
  flow_hours: 24                    # v85: kept -- assumption.md #8 CTB_FLOW on (rates from sheet 5 of the file above)
outsourced_items:                   # v97 (user 2026-10-13): procured from outside -> routing rows removed, always available,
