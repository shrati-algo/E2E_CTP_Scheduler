# ================================================================================
# PIECES PER CUT -- USER-CONFIRMED. What ONE cut of a cutter actually produces.
# ================================================================================
# USER 2026-07-13: "cuts/min is nos/min ... 15 cut/min that is tyres/min. 1 cut gives us
#                   b1 and b2 required for 1 tyre."
#
# v6 has NO `CUTS/MIN` branch at all. It fell through to the generic `endswith("/MIN")`
# rule -> `qty / proc_time`, which SILENTLY assumes 1 cut = 1 piece.
#
# That is right for the PLY CUTTER (1 cut = 1 ply) and WRONG for the BELT CUTTER, where a
# single cut yields BOTH belt plies (B1 + B2) for one tyre. The demand is raised in NOS of
# belt ply (2.000/tyre), so the cut count is qty / 2.
#
# Wrong (v6, 1 cut = 1 ply): 733,804 / 15 / 0.96 = 849 h on ONE machine with 720  -> 118%
# Right (1 cut = 2 plies)  : 366,902 / 15 / 0.96 = 425 h                          ->  59%
# NOTE (2026-08-06): the routing spells the bias cutter TWO ways -- "BIAS CUTTER" (79 rows) AND
# "Bios cutter" (465 rows, a typo). phase2._norm_op() canonicalises BOTH the keys below and the
# routing operation (uppercase + collapse spaces + BIOS->BIAS) so every bias-cut row gets pieces
# =2. Before the fix, the 465 "Bios cutter" rows silently defaulted to 1 -> m/c 2001 did 2x the
# work (56.5 d instead of ~28 d). Keys here are spelling/case-insensitive for cutters.
pieces_per_cut:
  BELT CUTTER: 2      # 1 cut = 1 tyre = B1 + B2. USER-CONFIRMED.
  BIAS CUTTER: 2      # 2026-08-03 USER: the bias cutter (m/c 2001) makes B1 + B2 in one cut (1 cut = 1 tyre). Matches "Bios cutter" too via _norm_op.
                      # Was default 1 -> counted 2x the cuts -> 2001 falsely at 93.8% util (the belt/ply tail).
  # PLY CUTTER: 1     # default. 1 cut = 1 ply. Do not list; 1 is the default.

# ================================================================================
# AGING FALLBACK BY ITEMTYPE -- from the plant's own table (ctp_inputfiles/aging_table_pcr.png)
# ================================================================================
# The per-ITEM `jkt_aging_master_pcr.csv` ALWAYS WINS. This is a FALLBACK, used only for an
# item that master does not carry -- instead of silently taking v6's generic (0 h, 72 h).
#
# That default was doing real damage: `CAP 66 - CAPSTRIP` (61% of net demand) has NO row in
# the aging master, so phase2 sized its lots believing max_aging = 72 h. Its real shelf life
# is 24 h. Cap strip is a bare 10 mm tacky ribbon on an open bobbin -- it loses building tack
# fast in Chennai ambient. A 3x-too-long shelf life means the scheduler builds it far too
# early and it arrives at the TBM dead.
#
# PCR column, transcribed EXACTLY from the plant table. Blank = not stated -> we do NOT invent
# one; the item keeps v6's default for that side.
#   GREEN_TYRE  15 min / 1 day      TREAD     2 h / 3 days     SIDEWALL   2 h / 3 days
#   BELT        -    / 1 day        PLY       -   / 1 day      INNERLINER 6 h / 3 days
#   BEAD_APEX   -    / 3 days       CAPSTRIP  -   / 1 day      CHAFFER    -   / 1 day
#   FINAL_COMPOUND / MASTER_COMPOUND: blank -- the master carries these; do not override.
#
# NOTE the table's own footnote: "Silica tread 1 day / Carbon tread 3 days". We CANNOT apply
# that from item_type alone -- there is no silica/carbon flag anywhere in the masters -- so
# Tread is left at 3 days. THIS IS AN OPEN QUESTION FOR THE PLANT.
aging_fallback_by_itemtype:
  "Green Tyres":            {min_h: 0.25, max_h: 24.0}
  "Tread":                  {min_h: 2.0,  max_h: 72.0}
  "SideWall":               {min_h: 2.0,  max_h: 72.0}
  "Steel Belt":             {max_h: 24.0}
  "Steel Belt Edge Strip":  {max_h: 24.0}
  "Ply":                    {max_h: 24.0}
  "Inner Liner":            {min_h: 6.0,  max_h: 72.0}
  "Bead Apex":              {max_h: 72.0}
  "Apex":                   {max_h: 72.0}
  "Cap Strip":              {max_h: 24.0}    # <- fixes CAP 66 - CAPSTRIP (61% of net demand)

  # !! `Capstrip Mother Roll` had NO aging row ANYWHERE, and that was catastrophic.
  # phase5:886 `DEFAULT_MAX_AGE_H = 365 * 24.0` -> an item with no row inherits a
  # *** 365-DAY (8,760 h) *** shelf life. phase2 gave the same item 72 h. The two phases
  # disagreed about one item by 121x.
  # The 8,760 h then DISABLED the safety brake in `resync_short_life_components`
  # (phase5:2100, `_pred_cap = predecessor_finish + predecessor_max_age`), which is the only
  # thing that holds a lot back from being ratcheted forward. 1,376 other lots WERE held by
  # that guard; cap strip never was -- so it smeared 500 h and finished 12 July.
  # An ABSENT ROW is the same class of bug as a BLANK CELL. See the present-but-blank rule.
  # USER-CONFIRMED 2026-07-13: "CAP 66-MOTHERROLL -- aging 0 to max 24 hr".
  # (I had guessed 72 h from "it is a big interleaved roll". WRONG. The plant says 24 h --
  #  the same shelf life as the cap strip slit from it. Do not re-guess this.)
  "Capstrip Mother Roll":   {min_h: 0.0, max_h: 24.0}    # PLANT-CONFIRMED
  "Chaffer":                {max_h: 24.0}
  "SLITTED MATERIAL":       {max_h: 24.0}
  "PRE CUT ROLL MATERIAL":  {max_h: 24.0}

