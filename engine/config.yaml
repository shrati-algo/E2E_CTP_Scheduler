# honest_est_report (M-4 FIX 2026-08-02): FORWARD-side completion of honest_lft_anchor. honest_lft_anchor
# repairs the backward LFT fan-out; the forward est_floor still keys off the tight fan-out lft[v], so 502
# non-terminal lots report negative slack even though a single production time EXISTS that is fresh for
# every consumer AND after all predecessors. This recomputes truthful slack from the real feasibility
# window and clears ONLY those proven-feasible false negatives; genuine infeasibilities (cold-start GT,
# predecessor-late belt) stay negative and are written to phase4_genuine_infeasible_updated.csv. REPORT
# ONLY — est/eft/lst/lft + AEST untouched, schedule byte-identical. Only active when honest_lft_anchor
# is report|full. neg-slack 1,219 -> 717 (genuine). off = keep the forward artifact in the report.
honest_est_report: true
# honest_terminal_anchor (H-3 FIX 2026-07-27): anchor each GREEN-TYRE terminal to its OWN de-pulsed
# `last_need - min_age`, not the MIN need_by over its fanned-out block set. phase2 de-pulses each GT
# sub-lot's deadline but maps every sub-lot to the whole bucket's blocks, so the block-min collapses
# a wave's sub-lots onto its earliest curing block (up to 72h too early) -> GT built early -> over-age.
# OFF = v6 block-min (byte-identical). ON = honest terminal deadlines. See FLAW_REGISTRY.md H-3.
