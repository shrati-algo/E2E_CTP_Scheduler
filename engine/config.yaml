  butyl_compounds: ["ML405", "ML605", "29MG"]        # BRM-03
  butyl_friendly: ["MB100", "MB200", "XMB98"]        # BRM-03
  compound_followers: {ML405: "MK3", ML406: "MK3"}   # BRM-05
  master_final_cleanout_item: "TR100"                # BRM-06
  master_final_cleanout_min: 5      # ASSUMED: TR100 not in routing -> ~1 batch + 2 min changeover
  same_item_shift_merge:            # v18 (2026-10-05) BRM-09: join a compound's split runs inside one shift (local moves, all limits kept)
    enabled: true                   # false = v17 behaviour
    machines: []                    # v36 (user): mixers only, as v18-v31 (v32 BR-9 had ALL)
    exclude: ["901"]                # 4RC: creel / spool-run order is kept by its own rules
    max_consumer_delay_h: 8         # a join may start a consumer up to 8 h later (0 = never delay a consumer)
    post_repair_relaxed_h: 8        # v38 (user: mixing rules applied completely): after the strict rounds, remaining splits joined with a consumer delay <= 8 h, then the repair re-times the later lots
    repair_units: true              # final repair: lots in current time order; same-item runs + IL campaigns move as blocks (keeps BRM-09 / 3.1.3)
  sticky_compounds: ["JT444", "JT466"]               # BRM-02
  sticky_stack_batches: 3
  buffer_batches: 5                 # v11 (2026-10-01): plant rule BRM-13 applied (+5 batches per compound; v5-v10 ran with 0). BRM-13 (+5 batches per compound, not special compounds)
  special_compounds: ["ML405", "ML605", "29MG"]      # + sticky compounds (excluded from BRM-13)
  # BR-V1 (2026-10-01, latest_schedule/BUSINESS_RULES_LOG.md): mixing output is planned in BATCHES.
  # BATCH -> phase2 rounds every MASTER/FINAL COMPOUND lot UP to whole batches and phase5 splits
  # each mixing lot into shift rows of WHOLE batches (columns `batches`, `batch_size_kg` on the
  # floor schedule; kg = batches x batch_size_kg). KG -> the previous kg planning, unchanged.
  mixing_output_uom: BATCH
  mixing_batch_source: ctp_inputfiles/routing_live.csv   # v87 (user 2026-10-13): JK_CTP_PPDS.CTP_Master_Routing (live), NOT CTP_Master_mixing
  # v85-v86: ctp_inputfiles/mixing_master_live.csv (JK_CTP_PPDS.CTP_Master_mixing, written live by build_sep_inputs.py)
  # v1-v84: INPUT_TABLES_30SEP_TRUE/01_DB_tables/JK_CTP_PPDS__CTP_Master_Routing.csv (a 30-Sep file copy)
  # BR-V2 (2026-10-01, latest_schedule/BUSINESS_RULES_LOG.md, butyl_rule.py): butyl-friendly sequencing.
  # A transition that breaks the sequence gets a 120 s CLEAN-OUT INSTEAD OF the mixer changeover (user 2026-10-06).
  # Enabled -> REPLACES the old BRM-03 purge (butyl_compounds / butyl_friendly above are then unused).
  butyl_sequence_rule:
    enabled: true
    cleanout_sec: 120                # 2026-10-06 user: butyl clean-out is 120 s -- keep for all runs (was 160)
    cleanout_basis: fixed            # 2026-10-06 user: fixed 120 s (was one_batch_cycle = one batch of the compound, BR-V10)
    targets_count_as_prep: false     # back to v65 (v67 test: true); v67 (user 2026-10-10): butyl -> butyl needs no clean-out (was false: ML405 -> ML605 also needed it)
    final:                           # final mixers
      targets: ["30G", "IL3", "IL5"]
      prep:    ["B1", "B2", "B99"]   # B1, B2: NOT in routing/BOM -> can never be scheduled (see log)
      family:  ["IL3", "IL5"]        # BR-V10 (user 2026-10-01): IL3 <-> IL5 run together -> plain compound changeover, no clean-out
      check:   [before]
      cleanout_basis: fixed          # BR-V13 (user 2026-10-01): broken final sequence -> 120 s clean-out
      cleanout_sec:   120
    master:                          # master mixers
      targets: ["29MG", "ML405", "ML605"]
      prep:    ["MB100", "MB200", "XMB98", "XMB98 Repass"]   # 'XMB98 Repass': no such code in routing/BOM
      check:   [before, after]
      cleanout_basis: none           # BR-V13 (user 2026-10-01): broken master sequence -> NO clean-out, only the 60 s changeover
