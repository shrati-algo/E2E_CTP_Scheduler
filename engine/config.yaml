# ================================================================================
# ROUTING RATE OVERRIDES -- USER/PLANT-CONFIRMED. Where the routing's rate is on the
# WRONG BASIS (machine INPUT) and the demand is on another (machine OUTPUT).
# ================================================================================
#
# --- CAP PLY SLITTER (machines 701, 702) -----------------------------------------
# PLANT-CONFIRMED 2026-07-13:
#     Cap strip slitter 1 :  33 MPM  x  12 bobbins
#     Cap strip slitter 2 :  60 MPM  x  16 bobbins
#     Bobbin change       :  18 min each, 4-5 times per 8 h shift
#
# THE BUG THIS FIXES. The routing states `60 M/MIN` and v6 divides the STRIP demand by it:
#     13,513,491 m / 60 / 0.96  =  3,910 machine-hours  ->  272% of a 720 h month
# That is a PHANTOM BOTTLENECK. It made the slitter the plant's #1 constraint, pushed
# 1,116 lots (17.2%) past the horizon, and dragged a JUNE plan out to 25 AUGUST -- 752 green
# tyres were late purely because they were waiting for cap strip that does not exist.
#
# The 60 was never the strip rate. It is the WEB (mother-roll) speed. The machine slits the
# web into MANY strips at once and winds them onto BOBBINS in parallel:
#     strip output = MPM x bobbins
#         slitter 1 :  33 x 12  =   396 m/min
#         slitter 2 :  60 x 16  =   960 m/min
#
# AVAILABILITY. A bobbin change is 18 min and happens up to 5 times per 8 h (480 min) shift:
#     (480 - 5 x 18) / 480 = 0.8125     <- worst case; 4 changes gives 0.85
# Folded into `efficiency` (which is what efficiency is for):  0.96 x 0.8125 = 0.78
#
# !! WE USE 396 -- THE **SLOWER** MACHINE -- FOR BOTH. THIS IS DELIBERATE AND CONSERVATIVE.
#    v6 holds ONE proc_time per routed_product; it CANNOT give 701 and 702 different rates,
#    and they differ by 2.4x. Using the FASTER rate for both would promise capacity the plant
#    does not have. Using the slower rate for both never over-promises.
#    Cost: slitter 2's extra capacity is not modelled, so the plan is pessimistic.
#      conservative (396 both) :   729 machine-h  ->  51% per machine   <- what we use
#      true (396 + 960)        :   capacity 45.7M m vs demand 13.5M     ->  29.6%
#    Either way it is NOT a bottleneck. See MEMORY.md if per-machine rates are ever needed.
routing_overrides:
  "CAP PLY SLITTER":
    proc_time:     396        # 33 MPM x 12 bobbins -- the SLOWER slitter. Conservative.
    proc_time_UOM: "M/MIN"
    efficiency:    0.78       # 0.96 machine eff  x  0.8125 bobbin-change availability

# ═══ BR-1 LINE-SPEED ROLL MULTIPLIER (2026-08-03, user business rule -> BUSINESS_RULES.md) ═══
# These calender products run N rolls in PARALLEL; effective M/MIN = single-strand rate x N.
# Applied in adapt_inputs.routing() by routed_product (M/MIN rows only).
# 2026-08-06 PLANT ROLL TABLE (user-provided -> BUSINESS_RULES.md BR-1): the edge-gum/TEG
# calender products run N rolls in PARALLEL; effective M/MIN = single-strand rate x N.
#   EG01=15, EG02=11, EG03=7, TEG-01=11 (belt; ply variant=4), TEG-02=9, CAP 66=11, BPG01=7.
# TEG-01/TEG-02 were WRONGLY skipped as "TBR single-strand" -> CORRECTED (they are multi-roll;
# TEG-01 feeds Steel Belt Edge Strip = belt = 11 rolls). EG03 was missing entirely. Both drove
# machine 1102 to 54 d at raw 13-14 M/MIN.
linespeed_rolls:
  EG01: 15                     # 30 x 15 = 450 M/MIN  (edge gum calender 1102)
  EG02: 11                     # 30 x 11 = 330
