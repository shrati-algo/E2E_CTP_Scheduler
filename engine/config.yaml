# WHY. **I INVENTED THAT FILE. THE PLANT NEVER SUPPLIED ONE.** Its own Notes column
# said "from ctp_v6/config.yaml" -- it was CONFIG LAUNDERED INTO A CSV TO LOOK LIKE A
# PLANT MASTER. Every other file in inputs/ is a reshape of something the plant sent.
# That one was a policy I made up, dressed as data, and then read back as if it were
# authority. That is the whole defect.
#
# IT WAS LIVE, NOT DEAD. phase4_cpm.py:370-377 read it and built `planning_max_map`,
# which feeds AEST via `get_effective_max_aging = min(chemistry_max, planning_max)`.
#
# IT WAS HARMLESS BY COINCIDENCE, NOT BY CONSTRUCTION -- which is what made it a
# LANDMINE. CAP30 and CAP STRIP 28 carry 72 h CHEMISTRY while the invented file said
# Cap Strip = 24 h. It only stayed inert because CAP30 is not routed and not a BOM
# child, so it never produces a lot. The day the plant loosens CAP 66 - CAPSTRIP to
# 72 h, this file would have silently cut it back to 24 h on 136 lots and NOBODY WOULD
# HAVE KNOWN WHY.
#
# DELETION IS A PROVABLE ZERO SCHEDULE DELTA. Verified 2026-07-14 against the real
# inputs, over the ONLY set that can ever produce a lot (routed AND a BOM child):
#     policy-mapped items                                : 1,820
#     PRODUCIBLE items where min(chem, planning) != chem :     0   <- zero. none.
#     the single item where planning BOUND (CAP30, 72 -> 24 h): NOT routed, NOT a BOM
#         child -> never enters demand -> never becomes a lot -> phase4 never sees it.
# With the file gone, `load_planning_max_aging_map` returns {} and
# `get_effective_max_aging` falls back to chemistry max for every item. AEST windows
# are IDENTICAL, item for item.
#
# v6 handles the file MISSING gracefully and says so out loud (phase4_cpm.py:142):
#     "planning_max_aging policy empty - AEST will use chemistry max_aging only"
#
# IF A REAL PLANNING-AGING POLICY IS EVER SUPPLIED BY THE PLANT, it belongs in
