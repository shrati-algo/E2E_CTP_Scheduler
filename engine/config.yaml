# ═══ V39 BUTYL DAY BLOCK (2026-10-06, user; mixing rules of 01-Oct) ═══════════════════════════════════════════
# One butyl block per group per plant day (07:00 -> 07:00), butyl and butyl-friendly compounds together in sequence:
#   Final Mixer - Before Butyl : butyl-friendly (B1/B2/B99) immediately before EVERY butyl compound (30G / IL3 / IL5)
#   Final Mixer - After Butyl  : 120 s clean-out after every butyl compound
#   Master Mixer - Butyl Seq.  : butyl-friendly (MB100/MB200/XMB98) immediately before AND after every 29MG / ML405 / ML605
#   IL3 or IL5                 : all of a day's batches of each in one run (inside the block)
# Real butyl-friendly lots of the day first (alternating items), else a prep lot of prep_lot_batches. Master block on
# K430-2 (the only master routed for 29MG and all butyl-friendly compounds; K270M cannot make MB100/MB200/XMB98).
# ═══ V47 MIXING RULES (2026-10-08, user; baseline v42 4RC settings) ═══════════════════════════════════════════
# A one compound on ONE mixer only (never split across mixers) -- each compound gets one routing-eligible mixer for the
#   plan (butyl / butyl-friendly on their block mixer, the rest balanced by run time), so no day has it on two mixers.
# B one run makes AT ONCE at least the next cover_h (15 h) of demand -- 24 h for IL3 / IL5 and the 4RC compounds --
#   and the same compound is not started again within gap_h (15 h) / gap_h_long (24 h) of its previous run's start.
#   Exempt: butyl-friendly compounds (B99 / B1 / B2 user; MB100 / MB200 / XMB98 run between butyl compounds by rule).
# C final mixers ~230 batches per shift (TARGET, not a cap): masters are made early enough that each final lot can
#   start from its own shelf-life floor (last use - (max aging - margin)).
mix_planner:                        # v56 (user 2026-10-09): stock-coverage mixing planner (code: mixer-improvement/mix_planner.py)
  enabled: true                     # all compound lots planned first, forward, by coverage; every mixing rule built in;
  cover_h: 15                       # v64: back to 15 (v63 test 20 -- see log) (gap stays 15 h, gap_h); a run covers the next 15 h of need (24 h IL3 / IL5 / 4RC compounds), back to back,
  cover_h_long: 24                  # v64: back to 24 (v63 test 30) (gap stays 24 h, gap_h_long); no changeover inside, compound not repeated within that time; one mixer per plant day;
  gap_h: 15                         # v63: repeat-gap RULE (not repeated within 15 h)
  gap_h_long: 24                    # v63: repeat-gap RULE for IL3 / IL5 / 4RC compounds (24 h)
  max_wait_min: 15                  # daily butyl / IL blocks with friendly before / after and 120 s clean-out; shelf life
  shelf_margin_h: 2                 # caps a run (MT871-type covered to shelf life); masters planned before their finals.
  changeover_s: 60
  tr100_s: 300
  cleanout_s: 120
  prep_lot_batches: 5
  butyl_cleanout_to: any            # back to v65 (v67 test: other); v67 (user 2026-10-10): 120 s clean-out only butyl -> non-butyl / non-friendly; butyl -> butyl / friendly = 60 s changeover
  fourrc_due:                       # v68 (user 2026-10-10): 901 first -- skim compound ranked by its 901 lot's start need
    enabled: false                   # v93 TESTED ON (127,255, -2,004 vs v87), not kept. (901 need - 901 run time - buffer_h); all mixing rules still checked
    buffer_h: 4
  closed_loop:                      # v69 #3 (user 2026-10-10): phase 5 + 6 re-run with the mixers re-planned on round-1 real needs
    enabled: true
    qty_feedback: true              # v76 (user 2026-10-11): extra quantity phase 5 schedules (4RC, prep runs) is fed back into the
                                    # compound lots (finals -> masters) before round 2, so mixing makes it (run_pipeline._qty_feedback)
    rounds: 3                       # v77: 3 (quantity feedback also after round 2; was 2)
    buffer_h: 2
  starve_boost:                     # v66 (user 2026-10-10): live master priority -- when F270 / K310 run out of planned work
    enabled: false                   # within horizon_h, masters blocking the top_finals most urgent waiting final lots get
    horizon_h: 3                    # boost_h more urgency on the master mixers (all mixing rules still checked)
    top_finals: 6
    boost_h: 48
    final_mixers: ["F270", "K310"]
  level_load:                       # v62 (user 2026-10-10): smooth the final demand peaks -- backward finite-capacity pass,
    enabled: true                   # a peak day's excess is made on the days before (shelf-life floor still applies)
    final_mixers: 2
    master_mixers: 4
    masters: true
  item_priority_h:                  # v60: extra planner priority (h) per compound -- B616M feeds CAP 66 (24 h shelf life)
    B616M: 8                        # v90 TESTED 24 h (not kept): 8 -> 24 h, CAP 66 compound a day ahead (as B1144) so cap strip is never late
    B1144: 24                       # v75 (user 2026-10-11): belt edge filler 1802 never waits for compound -- B1144 and its
    B186: 24                        # chain (B186 -> MB185 -> MB184 -> MB183) ranked a day ahead, as the plant keeps ~1 day of
    MB185: 24                       # B1144 stock (beltedgefiller_schedule.xlsx: age at use median 27 h); shelf-life floor kept
    MB184: 24
    MB183: 24
    # v89 / v90 TESTED, not kept: inner-liner compounds 8 h ahead (B355, B458, EFA, GB35, GB58, GL6, GL7: 8)
  gap_h_fourrc: null                # v94 TESTED 12 (rule relaxed, 52 x used; 127,812), off = rule. v94 (user 2026-10-13, RULE RELAXED #1): 4RC skim compounds may repeat after 12 h (rule: 24 h); remove = rule
  second_mixer_cover_h: 0           # v94 TESTED 8 (never used), off = rule. v94 (user 2026-10-13, RULE RELAXED #2): 2nd mixer same plant day when the next lot is needed within 8 h; 0 = rule
  butyl_gap_wait_h: 6               # v124 (user 2026-10-15): butyl block WAITS (<= 6 h) for a due butyl item's 24 h repeat gap instead of dropping it for the day (IL3 / 30G skipped days in v122); 0 = v122
  final_cleanout_after_s: 120       # v98 (user 2026-10-13): ON again. DEFAULT v87 = 0; was 120 STANDING (user 2026-10-13): 120 s clean-out after EVERY final compound, every mixer (audit M9); 0 = v87
  machine_factor:                   # v91: run-time factor per "ITEM|MIXER" (kg/h differs off the routing home). T638 on K430-2:
    "T638|K430-2": 1.034            # plant 335 kg / 205.2 s = 5,877 kg/h vs routing 225 kg / 133.3 s = 6,078 kg/h -> x1.034
  fourrc_priority_h: 8              # v84 TESTED 24 (4RC compounds a day ahead): cured 126,196 vs v82 127,864 -> not kept. v58: 4RC skim compounds (and their masters) ranked 8 h ahead (shelf-life floor still applies)
tbr_bead_one_step:                  # v74 (user 2026-10-11): plant TDA 2403/2404/2405 winds + apexes a TBR bead in ONE booking
  enabled: true                     # (tda_schedule.csv). apply_ctb_approximations.py: TBWB inputs (S54, bead wire) -> TBAPBD
                                    # directly, TBWB routing rows dropped; apexed-bead routing rate unchanged. false = v72 (2 steps)
plant_mixing_cycles:                # v91 (user 2026-10-13): plant-approved cycle time for FINAL compounds = median batch-to-batch
  enabled: false                    # v130 TEST: off -- mixing cycles = faster of routing and the workbook's MIXER sheet                     # v98 (user 2026-10-13): ON again (finals, faster only). DEFAULT v87 = false; was STANDING: faster plant cycles. v92 TESTED faster-only (125,662), v91 all (129,309). Plant cycle only where FASTER (faster_only). v91 TESTED all (129,309). Time in the plant's own bookings 04-11 Oct (CTP_Plant_Schedule);
  file: latest_schedule/plant-schedule/plant_mixing_cycles_04_10oct.csv   # build_plant_mixing_cycles.py
  min_intervals: 20                 # pairs measured on >= 20 batch intervals only; others keep the DB routing cycle
  operations: ["FINAL MIXING"]      # v87 default (switch off); v96 had ["FINAL MIXING", "MASTER MIXING"] (user): masters too (faster only); v91-v95: FINAL MIXING only
  faster_only: true                 # v92 (user): slower plant values ignored (routing kept); false = v91 (both)
final_on_master_mixers:             # v91 (user 2026-10-13): finals the plant runs on a master mixer may be planned there
  enabled: true                     # v98 (user 2026-10-13): ON again. DEFAULT v87 = false; was STANDING (user 2026-10-13: "run other final compounds on master mixer as the plant does", all runs until said otherwise) (v91 / v92: only T638 on K430-2: 222 batches 04-11 Oct). 120 s clean-out before AND after a final on
  pairs: {"*": ["K270M", "K430-1", "K430-2", "F440"]}   # "*" = every final; routing batch size / cycle (preference sheet has no
                                    # final weights on master mixers). 120 s clean-out after every final (mix_planner.final_cleanout_after_s)
relaxed_mixing:                     # EVALUATION ONLY (user 2026-10-11, run v75_relaxed): mixing cycle / batch kg from the plant
