# PLANNING MAX AGING -- DELETED 2026-07-14. (A) DEFECT. DO NOT RE-ADD IT.
# ================================================================================
# `planning_max_aging_h` USED TO LIVE HERE, and adapt_inputs.py wrote it out as
# inputs/planning_max_aging.csv in v6's master schema. BOTH ARE NOW GONE.
