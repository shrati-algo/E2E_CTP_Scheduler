# ==============================================================================
# v2 FIX FLAGS
# ==============================================================================
# THE RULE THESE FLAGS ENFORCE. The overall LOGIC and ALGO stay the SAME; we correct
# INSIDE it. Two classes of change, and they are NOT the same thing:
#
#   (A) DEFECT -- the code carries a rule it FAILS TO EXECUTE. Fixing it needs no
#       approval: we are making the code do what it already says it does.
#   (B) POLICY -- the code executes its rule CORRECTLY and we want a DIFFERENT rule.
#       This is a decision, not a bug. It gets a FLAG, and the DEFAULT IS v6's
#       behaviour. Nothing below silently changes the algorithm.
#
# !! THIS FILE MUST STAY PURE ASCII. No arrows, no emoji, no curly quotes, no em
#    dashes. `load_cfg()` does `yaml.safe_load(open(ROOT/"config.yaml"))` with NO
#    explicit encoding, so on Windows it decodes with cp1252. A non-ASCII byte here
#    once crashed all 8 phases. (8 em dashes were removed from this file on
#    2026-07-14 for exactly that reason.)

# ---- (A) DEFECT, RESTORED -----------------------------------------------------
# enable_short_life_resync: this is v6's OWN DEFAULT and it is now RESTORED.
#
# CONFESSION, RECORDED SO IT CANNOT ROT: I had disabled this v6 pass AND HID IT. The
# key was simply absent from config, so `cfg.get("enable_short_life_resync", False)`
# silently defaulted it OFF. That was an UNAUTHORISED ALGORITHM CHANGE wearing the
# costume of a default. A flag that changes the algorithm and cannot be seen in config
# is indefensible whichever way it is set. It is now EXPLICIT and ON.
#
# The pass has real (A) defects of its own -- a one-way ratchet, no precedence
# re-propagation, and it aims at a POOLED QUANTILE instead of successors[lot]. Those
# are being fixed INSIDE the pass (phase5), which is the correct place. Fixing a
# defective pass is not the same as deleting it.
enable_short_life_resync: true

# ---- (B) POLICY -- AND A DEVIATION FROM v6. SEE THE DEVIATION TABLE AT THE TOP. ----
# seed_kitpool_from_inventory: phase6 never read inventory.csv at all, so the kit pool
# started EMPTY even though the plant has real opening WIP on the floor. Turning this
# on lets phase6 see stock that physically exists. (B), not (A), because v6's rule
# ("the pool starts empty") is executed correctly -- we want a different rule.
#   MEASURED: true -> makespan 21.7 h SHORTER than false.
#   v6's VALUE IS false. This is a DELIBERATE, FLAGGED DEVIATION.
#
# !! AND DO NOT DELETE THIS KEY EITHER -- deleting it does NOT get you v6.
#    VERIFIED 2026-07-14, phase6_curing_revision.py:1291:
#        if bool(cfg.get("seed_kitpool_from_inventory", True)):
#    The CODE FALLBACK IS **True**, i.e. the code's own default is the DEVIATION, not
#    v6's rule. Remove the key and the pool STILL gets seeded, silently. The only way to
#    get v6's empty pool is to write `false` here EXPLICITLY.
seed_kitpool_from_inventory:   true    # S5 (2026-07-16): seed opening GREEN-TYRE WIP (age-checked 24h, whitespace-matched; codes match, no SQ/CAP mismatch here). Closes ~3,656 of the opening-WIP kit shortfall (SHORT 3,707->~51). phase1c #24/#25 net the SAME alive stock, so NOT double-counted. Verified by vikram-iyer.

# ==============================================================================
# !! green_tyre_max_age_h -- **DO NOT DELETE THIS KEY.** (E7) (A) DEFECT.
# ==============================================================================
# TWO PHASES FALL BACK TO DIFFERENT VALUES IF THIS KEY IS ABSENT. Deleting it does
# not "restore a default" -- it makes phase5 and phase6 SILENTLY DISAGREE BY 3x
# about how long a green tyre lives. VERIFIED IN THE CODE 2026-07-14:
#
#   phase5_forward_placement_v2.py:994
#       float(cfg.get("green_tyre_max_age_h", 72.0))            -> 72 h   (v6's number)
#   phase6_curing_revision.py:560
#       float(cfg.get("green_tyre_max_age_h", 0) or 0)          -> 0, then it falls
#       through to aging_fallback_by_itemtype["Green Tyres"]["max_h"]  -> 24 h
#
#   REMOVE THE KEY  ->  phase5 builds to a 72 h shelf life while phase6 expires the
#   very same tyre at 24 h. The build side and the cure side would be running two
#   different plants. WITH the key present both read 24 and they agree.
#
# THE PLANT'S NUMBER IS 24 h. Confirmed TWICE, independently:
#   1. inputs/aging_master.csv -- 222 of the 224 mappable GT codes have a row, all 24 h.
#   2. the plant's own aging table (ctp_inputfiles/aging_table_pcr.png), PCR column:
#      GREEN_TYRE = 15 min min / 1 day max.
# v6's 72 h is a v6 number, not a CTP number. A green tyre is a tacky, uncured assembly;
# this plant does not hold it for three days.
# *** DO NOT INVENT A THIRD NUMBER. The two candidates are 24 (plant) and 72 (v6). ***
#
#   Impact of 24: a TIGHTER window. It builds green tyres CLOSER to their curing slot.
#
# REPORTED UPSTREAM: the real fix is to make the two phases share ONE fallback. That
# needs an edit to phase5/phase6, which this config cannot do. Until then, THIS KEY IS
# THE ONLY THING HOLDING THEM TOGETHER.
green_tyre_max_age_h:          72      # KEEP KEY (see DO-NOT-DELETE note above). NOW A FALLBACK ONLY. With green_tyre_age_override_master OFF: phase2 reads aging_master (source), phase6 reads aging_master per-SKU (source; this 24 only fills a GT code with NO master row -- none exist).
# M-5 CORRECTION (2026-07-27): aging_master GT rows are MaxAging=48h (user-confirmed 2026-07-25), NOT 24.
# The code reads 48 from the source; this `24` fallback is INERT. Do NOT "correct" aging_master back to 24. phase5 ALSO now reads aging_master (source, per-item 0.25h/24h) -- see phase5 "GREEN-TYRE SHELF LIFE FROM SOURCE" edit. The value 24 matches the plant master; it is no longer the driver.
green_tyre_age_override_master: true  # USER-DIRECTED (2026-07-16, CLEAN PIPELINE): OFF. phase2 (lot window) + phase6 (over-age verdict) now read the plant aging_master.csv (24h) DIRECTLY, from SOURCE. No config value supersedes the master. Aging is a REPORT, not a rejection.

# ==============================================================================
# S2 -- CLOSE THE BUILDING->PRESS FEEDBACK LOOP  (drum-pinned two-pass converge)
# ==============================================================================
# THE ROOT CAUSE THIS FIXES (proven, 2026-07-16):
#   phase4 anchors green-tyre building to the ORIGINAL plan.csv press times.
#   phase6 then slides the presses later (+32 h median, up to +277 h) with NO
#   feedback to building. So the green tyre is built ON TIME for the FICTIONAL
#   plan slot, then sits waiting for a press that is actually busy, and rots.
#   Measured: 95% of green-tyre age is PRESS-WAIT, only 5% is build-spread.
#
# THE FIX (this flag): a two-pass drum-pinned convergence, orchestrated by
# run_pipeline.py when this flag is TRUE.
#   Pass 1: phase4(anchor=plan.need_by) -> 5 -> 6.  phase6 emits P1 = the revised
#           press start per block (outputs2/phase6_press_start_P1.csv snapshot).
#   Re-anchor: phase4 re-runs with each terminal green-tyre lot's LFT pinned to
#           P1 - min_aging (phase4_cpm.py:~418), so the WHOLE component kit is
#           re-timed to the slot the press ACTUALLY runs, not the plan slot.
#   Pass 2: phase4 -> 5 -> 6, with phase6 pinning press start to P1 as a HARD
#           FLOOR (phase6:~1187): candidate_start = max(P1, kit_ready, prev_end).
#   Assert convergence P2 == P1 (0 blocks moved off P1). If a block cannot make
#           P1 (kit not ready) it ratchets: P_{k+1} = max(P_k, phase6(build_to P_k)),
#           up to converge_max_iters passes, and the driver LOGS how many it took.
#
# The presses are NOT moved earlier and the makespan is NOT grown vs pass 1 (that
# time was already spent). Expected: press-wait -> ~0, physical green-tyre age ->
# ~min_aging (near 0), over-age at BOTH 24h and 48h -> near 0.
#
# DEFAULT FALSE => run_pipeline.py does a single pass = byte-identical to today.
# The P1 anchor/floor are read by phase4/phase6 ONLY when this flag is TRUE **and**
# the P1 snapshot file exists (the driver owns its lifecycle: deleted before pass 1,
# written after). A plain single-pass run therefore stays byte-identical.
converge_building_to_press:    false   # USER-DIRECTED (2026-07-16, CLEAN PIPELINE): OFF. No multi-pass drum-pin. Single pass = byte-identical to v6. Building anchors to plan press times; phase6 slides presses; aging is MEASURED, never fed back to reject/defer building.
# converge_max_iters -- MEASURED 2026-07-16, and the "one extra pass converges"
# PREDICTION DID NOT HOLD (see below). The pin assumed building FINISHES at
# P1 - min_aging; phase5 does NOT JIT building to its LFT -- it builds green tyres
# at the EARLY-to-MID of their freshness window and in campaign bursts -- so
# kit_ready != P1 - min_aging and the fixed point does not close. It ratchets.
#   max_iters=1 (single extra pass): over-24h 56.0% -> 34.4%, over-48h 30.8% ->
#              15.1%, makespan 41.1 -> 43.4 d. Stable, no runaway tail. DEFAULT.
#   max_iters=4 (ratchet):           over-24h -> 29.5%, over-48h -> 15.6%,
#              makespan -> 47.6 d, and a fat tail (worst tyre ~396 h) because the
#              ratchet keeps pushing presses later without ever settling.
# The extra 3 passes buy ~5 pp of over-24h for +4 days of makespan and a worse
# worst-case. 1 is the better trade and the honest, stable choice; raise it only
# if you value the last 5 pp over makespan and accept non-convergence.
converge_max_iters:            1

# ==============================================================================
# S3 -- PER-SKU GREEN-TYRE WIP CAP  (the rope, a HARD invariant)
# ==============================================================================
# Even with S2 closing the loop, nothing STRUCTURALLY stops building from running
# a SKU far ahead of the press. This is the TOC rope: a green tyre of a SKU may
# not be built if it would push the count of UN-CURED green tyres of that SKU over
# `ceil(cover_h x that SKU's press-consumption rate)`. The rate is measured from
# the REVISED (P1) press schedule -- what the press ACTUALLY consumes -- not the
# fictional plan. A placement that would breach the cap is pushed later (into its
# machine's next free slot) and LOGGED loudly. NEVER silently rotted.
#
# cover_h basis: the plant buffer_master.csv (jkt_buffer_master_pcr) has NO
# "Green Tyres" row -- the plant does not publish a GT hours-of-cover. The natural
# cover for a green tyre is its own shelf life, which the plant aging_master fixes
# at 24 h. So 24 h is used as the rope window. (buffer_master IS read and honoured
# for the components it DOES list; vikram confirmed the scheduler ignored it.)
#
# DEFAULT FALSE => phase5 places exactly as today. The cap needs P1, so it is a
# no-op in pass 1 (P1 not yet known) and only binds in pass 2+.
green_tyre_wip_cap:            false   # USER-DIRECTED (2026-07-16, CLEAN PIPELINE): OFF. This was REJECTING VALID LOTS -- it deferred green tyres up to +553h (out of their aging window) to hold a per-SKU WIP rope. RULE NOW: "if the tyre is built, cure it" -- never defer/drop a valid lot for aging. Aging is a report only.
green_tyre_wip_cover_h:        24      # rope window (GT plant shelf life; buffer_master has no GT row)

# ---- FIX 2 -- PRESS PULL-FORWARD (drain the green-tyre queue continuously) ----------
# phase6's press formula is max(orig_start, kit_ready, prev_end): a press IDLES until its
# plan-clock slot even when the kit is ready AND the press is free. The critical-path
# study proved the extra ~5 makespan days are green tyres WAITING (last-100 lots: built
# day 29.6, cured day 34.6 = 125 h wait) while presses sit ~40% idle. This DROPS the
# orig_start floor: a press starts its NEXT planned block as soon as it is free and the
# kit is ready (floored only at the schedule horizon open). It NEVER re-sequences a press,
# re-assigns a block, double-books, or cures before the kit exists -- it only removes idle
# waiting, so it cannot rot a tyre (curing earlier = fresher, not staler). Unlike
# green_tyre_jit_build / building_level it does NOT touch building, so no downstream rot.
# DEFAULT FALSE => byte-identical (candidate_start = orig_start).
press_pull_forward:            false

# ---------------------------------------------------------------- S6 streaming
# press_streaming_kit_gate: a press may start curing as green tyres FLOW to it,
# instead of waiting for EVERY tyre of an 8-h block to be built.
# PLANT EVIDENCE (June 2026 MES): 95.8% of build campaigns had curing START BEFORE
# building FINISHED; the transfer unit is ONE green tyre feeding a median of 6
# presses at once; campaign-start -> first-cure is a median of 0.98 h.
# The offset is the routing's GT BUILDING transfer_time_min (plant workbook: 90 min),
# read from routing.csv unless gt_transfer_time_min overrides it here.
press_streaming_kit_gate:      true
# gt_transfer_time_min:        90    # uncomment to override routing.csv
gt_transfer_time_min:          120   # v78 (user 2026-10-11, Algo Planning BRBC-21): green tyre min aging 2 h before curing (routing transfer 90 min)
curing_keep_changeover:        true  # v78 (user 2026-10-11, BRBC-27): mould change (plan CO minutes incl. cleaning) moves with the SKU sequence when cure blocks slide


# ==============================================================================
# LEVER 1 -- S2b: JIT TERMINAL GREEN-TYRE BUILDING  (EXPERIMENT, prove-or-revert)
# ==============================================================================
# The residual green-tyre over-24h (19.1% with S1/S2/S3/S5) is because phase5
# places terminal GT building at the EARLY freshness floor (fresh_floor = LFT -
# (max_age - min_age) = LFT - 24 h), so building finishes ~half a shelf-life early
# and the tyre WAITS in the per-SKU pool. This flag re-targets the terminal GT
# build to its LFT (finish = due = P1 - min_aging, as-late-as-possible in the
# cure-by band) so it lands fresh at the press. GREEN TYRES ONLY -- carcass and
# feeders untouched. Machine capacity still respected (forward packer, no double-
# book). This RE-OPENS the building-JIT failure mode that killed building_level /
# feeder_jit, so it is proven, not assumed: KEEP only if green over-24h drops AND
# component over-age does not rise AND phantom/negative-gap/double-book/makespan
# do not regress. DEFAULT FALSE => byte-identical to today's fresh_floor build.
#
# RESULT (MEASURED 2026-07-16, flag ON, full pipeline + FEFO audit):
#   green over-24h 19.06% -> 9.65%  (GOOD, -9.4 pp)   median 11.9h -> 7.4h
#   green over-48h  5.30% -> 5.74%  (worse)
#   COMPONENT FEFO 43.86% -> 54.69% (WORSE, +10.8 pp) <-- the warned failure mode
#   phantom 33,723 -> 33,723 (unchanged)   makespan 45.94 -> 46.59 d
#   negative-gap 0, double-book 0 (clean)
# VERDICT: REVERTED. Delaying the GT build to its LFT makes it CONSUME its
# components ~half a shelf-life later, so the components (built on their own
# schedule) sit and rot: it moved ~31k tyres out of GT over-age at the cost of
# ~280k component-units INTO over-age. Net strongly negative; component over-age
# rising is an explicit revert condition. Same class of failure as building_level
# / feeder_jit. Flag OFF => byte-identical to the shipped 19.06% / 43.86% output.
green_tyre_jit_build:          false

# ==============================================================================
# LEVER 2 -- S6: phase3 DAG FEFO QUANTITY-ALLOCATION  (EXPERIMENT, prove-or-revert)
# ==============================================================================
# Component FEFO over-age (43.86%) is driven by phase3 OVER-LINKING: build_dag_edges
# fan-links each feeder (child) lot to EVERY block+aging-compatible green-tyre lot in
# its 3-day wave, so phase4's backward CPM collapses each feeder's LFT to the
# wave-START -> feeders built in early bursts -> they WAIT -> rot. phase4_cpm.py's own
# comment (~:544) names the clean fix as a phase-3 quantity-allocation redesign, NOT
# an LFT override (which it gates OFF because it starves early days).
# ON => build_dag_edges_qty_alloc: each feeder lot's QUANTITY is FEFO-allocated to the
# GT lots it actually serves (oldest supply -> earliest demand), emitting an edge only
# where a feeder contributes quantity. Its LFT then tracks the LATEST GT it feeds, so
# feeder production spreads to level demand instead of bunching at wave-start. The block-
# overlap, aging-window and routing-sku HARD constraints are preserved byte-for-byte.
# KEEP only if component over-age drops AND green over-age does not rise AND phantom /
# negative-gap / double-book do not regress. DEFAULT FALSE => v6 fan-link, byte-identical.
#
# RESULT (MEASURED 2026-07-16, flag ON, full pipeline + FEFO audit of record):
#   COMPONENT FEFO 43.86% -> 47.05% (WORSE, +3.2 pp; over-age UNITS 1.14M -> 1.49M)
#   green over-24h 19.06% -> 18.07% (marginally better)   green over-48h 5.30 -> 5.37
#   phantom 33,723 -> 33,723 (unchanged)   makespan 45.94 -> 43.06 d (better)
#   negative-gap 0, double-book 0 (clean);   DAG edges 21,858 -> 14,609
# APPLES-TO-APPLES (122 items verified in BOTH): 43.86% -> 43.04% (only -0.8 pp) BUT
#   with severe per-item VOLATILITY (e.g. Steel Belt B1-PBLT093 1.8% -> 56.1%, +54 pp).
#   The headline rose because allocation pulls more high-over-age items into the
#   VERIFIED set (123 -> 142; e.g. CALANDARED ROLL at 80%). 5,589 consumer-item demands
#   were left under-covered: the block-overlap HARD constraint fragments FEFO supply so
#   later consumers draw older stock -> rot REDISTRIBUTES, it does not reduce.
# VERDICT: REVERTED. It does not drop component over-age below 43.9% (audit of record
#   ROSE to 47.1%), and the flat common-item aggregate hides big per-item regressions.
#   WHY the mechanism failed & WHAT IT WOULD TAKE: spreading feeder LFTs in phase3 only
#   moves DEADLINES; phase5 still forward-packs feeders EARLY (campaign FFD + fresh_floor),
#   so feeders still wait. The real driver of component over-age is phase5 PLACEMENT TIME,
#   not phase3 linkage. Fixing it needs a COORDINATED backward/pull placement of the whole
#   feeder->GT->press chain in phase5 (true DBR rope) -- a phase5 re-architecture, not a
#   DAG flag -- and that is the same class as the tested-dead building_level / feeder_jit,
#   which is why Lever 1 (JIT one stage) just shifted rot onto its feeders. Flag OFF =>
#   byte-identical to the shipped 19.06% / 43.86% output.
dag_quantity_allocation:       false

# ---- !! DEVIATION FROM v6. SEE THE DEVIATION TABLE AT THE TOP OF THIS FILE. ----
# building_month_cap_h: v6's own value is 31 * 24 * 0.90 = 669.6 h. v6 computes it INLINE,
# so changing it used to mean EDITING CODE. It is now a config key -- phase5:770 reads it
# as BUILDING_MONTH_CAP_H and it caps every building machine's monthly hours.
#
# !! THE SHIPPED VALUE IS 480, AND **NOTHING MEASURED OR DOCUMENTED SUPPORTS 480.**
#    The phase5 write-up documents 507 and 669.6. 480 is NEITHER. Its provenance is
#    UNKNOWN. (The code fallback IS correct -- `cfg.get("building_month_cap_h", 31*24*0.90)`
#    -- so it is THIS LINE, not the code, that departs from v6.)
#
#    MEASURED:  480   -> building peak 637.2 h
#               669.6 -> building peak 690.4 h    (v6)
#
#    LEFT AS SHIPPED ON PURPOSE. Changing a live capacity cap is a JUDGEMENT CALL and it
#    belongs to the user, not to whoever is editing this file. It is flagged, not fixed.
building_month_cap_h:          648.0   # CTP: 30 din x 24 h x 0.90 (June = 30 din, v6 ka 31 galat tha)

# ---- (B) POLICY -- BUILDING LOAD BALANCING. FLAGGED, DEFAULT OFF ---------------
# balance_building_load: BUILDING is the ONLY unbalanced department. At cap 480 its
# machines run 637.2 h (3403, 88.5%) down to 283.3 h (3409, 39.4%) -- a 49-point spread,
# where every other department is inside 22. 3409 is legally eligible for 1,419.5 h of
# work and is handed 283.4 h. NOTHING BLOCKS IT: not inch, not portfolio, not eligibility.
# (BUILDING_SKU_MACHINE_MAX, _pcap and LOAD_CAP are all DEAD CODE -- never read.)
#
# THE CAUSE IS THE PACKING ORDER, NOT THE CAP. v6 packs item-groups LARGEST-FIRST (LPT),
# and a group dumps every one of its lots onto ONE machine until the cap. So the big
# FLEXIBLE groups take the popular machines first, and a 318.7 h group eligible on ONLY
# {3403, 3408} arrives to find both already full -- and blows through the cap on both.
# Meanwhile 3409, which nothing was ever forced to use, idles.
#
# ON = most-constrained-first order + fair-share cap + load-first spill. MEASURED:
#                        v6 (OFF)          balanced, slack 1.06
#     building peak      637.2 h (88.5%)   543.3 h (75.5%)     LP lower bound 506.7 h
#     spread             49.1 pts           13.9 pts
#     machine 3409       39.4%              67.4%
#     changeovers        530 (447.1 h)     470 (412.5 h)       <- FEWER, not more
#     makespan           36.21 d            35.45 d
#     cured in 35 d      99.64%             99.91%
#     press starvation   198.2 h / 9 presses  46.5 h / 5 presses  (over a 120 h budget)
#     GREEN-TYRE EXPIRY  28.89%             31.10%              <- WORSE. THE REAL COST.
#     DAG violations     0                  0
#
# !! TWO HONEST WARNINGS.
#  1. THE MAKESPAN GAIN IS NOT CAUSED BY THE BALANCE. The response is NON-MONOTONE:
#     slack 1.00 gives the BEST balance (spread 5.8 pts) and the WORST makespan (36.54 d,
#     worse than v6). Only the 1.04-1.08 plateau lands at 35.35-35.45 d. Downstream is
#     chaotic w.r.t. this knob -- take 35.45 d as an empirical result at this config, not
#     as a mechanism, and RE-MEASURE after any data change.
#  2. IT DOES NOT BUY THE 35-DAY TARGET. Makespan 35.45 d, 99.91% cured in 35 days,
#     100% at 36.0 d. It closes ~3/4 of the press-starvation gap and NOT the last of it.
#
# THE BALANCE ITSELF IS ROBUST AND CAUSAL (predicted offline, reproduced in the pipeline
# to 0.1 h). Turn it on for a balanced, executable building line.
#   BEST CONFIG:  balance_building_load: true   building_balance_slack: 1.06
# DEFAULT FALSE = v6's behaviour (LPT order, month cap).
balance_building_load:         true    # USER-DIRECTED (2026-07-16): ON. Balance TBM/building load across all eligible machines (most-constrained-first + fair-share cap + load-first spill). Bounded by routing eligibility.
# Fair-share slack in balanced mode: cap = (total building work / machines) x slack.
# 1.00 = perfect share (best peak, worst makespan). 1.04-1.08 is the stable plateau.
# Ignored entirely when the flag is off.
building_balance_slack:        1.06

# ---- CTP DEVIATION #31 -- PER-CODE TAKT SPREAD (min TBMs by DAILY curing pull) ------
# balance_building_load spreads work ACROSS codes but pins a single high-volume code to
# ONE machine unless its MONTH-TOTAL exceeds the fair-share cap. MEASURED: 27 of 30
# multi-eligible GT codes run on 1 TBM (mean 1.13) and our curing tail is 8 d (90->100%)
# vs the plant's 3 d; the plant runs those codes on 2-3 TBMs. This gives each long-pole
# code a MINIMUM machine count from its DAILY pull = ceil(daily_h / (per_machine_daily_h
# * target_util)) and round-robins its lots across that many least-loaded eligible
# machines. Only codes above building_takt_min_hours move. Bounded by routing eligibility.
# DEFAULT FALSE = byte-identical to today. Measure changeovers: spreading a code adds
# them, and that cost is the makespan ceiling (building_level blew 36->64 d on this).
building_takt_spread:          true    # SHIPPED 2026-07-20: MEASURED 38.79->37.02 d, over-24h 55.0->53.6%, invariants hold. Spreads 27->18 single-pinned codes (mean machines/code 1.13->1.60). +133 building changeovers is the cost; 37.02 is the lever's floor (residual = cold-start/plan-ramp, data-side).
building_takt_target_util:     0.65    # single-code per-machine daily headroom (0.65 best measured)
building_takt_min_hours:       120.0   # only split codes with >= this many build-hours (120 beats 250: same makespan, better aging)

# ---- (B) POLICY -- EQUAL LOAD-BALANCING FOR EVERY NON-BUILDING GROUP. CTP #28 -------
# balance_all_machines: extends equal load-balancing to EVERY machine group served by
# the per-lot dispatcher (mixers, cutters, calenders, tread/extruder, slitters, bead) --
# NOT just building. When multiple machines are ROUTING-ELIGIBLE for a lot and its
# material (kit) is ready, the lot goes to the LEAST-LOADED eligible machine among those
# that can finish within balance_all_tolerance_h of the earliest achievable finish, so no
# eligible machine idles while a sibling saturates. Bounded by routing eligibility
# (inputs/routing.csv) -- it never fabricates eligibility -- and by the tolerance, so it
# never delays a lot more than the band or shreds a mother-roll/campaign run.
# DEFAULT FALSE = shipped earliest-finish picker. USER-DIRECTED (2026-07-16): ON.
balance_all_machines:          true
# Tolerance band (hours) for the above. A machine balances a lot only if it can finish
# within this of the lot's earliest achievable finish. 1.0 h is a safe default; larger
# spreads more aggressively (at some changeover cost), 0 disables (earliest-finish only).
balance_all_tolerance_h:       1.0

# reinsert_changeover_blocks: phase6 DELETES the CHANGEOVER rows that plan.csv reserves
# -- 105 blocks / 356 h of real mould-change time -- and then reports the presses as if
# that time were free. Turning this on puts them back.
#   DEFAULT FALSE = v6's behaviour. Turning it ON makes the press schedule TIGHTER and
#   more honest, and it will surface lateness that is currently hidden.
reinsert_changeover_blocks:    false

# ==== PHASE6 CURING-TAIL FIXES (2026-07-27) -- see PHASE6_CURING_TAIL_BUG.md ==========
# FIX A -- clamp_wip_seed_to_plan_start: opening WIP is physically on the floor at t0, so a
#   produced_time AFTER plan_start (a wrong-month inventory snapshot) is a data error. When ON,
#   such a seed is FLAGGED loudly and its kit-ready is clamped to plan_start instead of being
#   treated as "available in the future" (which strands curing). No-op when every produced_time
#   <= plan_start (the shipped JUNE run) -> byte-identical there.
clamp_wip_seed_to_plan_start:  true
# FIX B -- press_gap_fill: replace phase6's scalar per-press `prev_end` cursor with a per-press
#   FREE-SLOT search. A kit-late block takes the earliest hole on its press instead of the queue
#   tail, so it never head-of-line-blocks later kit-READY blocks. Kills the 4x amplification that
#   turned a 1% shortfall into a 40-day April tail. OFF = scalar cursor (byte-identical). All hard
#   invariants still enforced (duration, no-before-orig, no-before-kit, no double-book, immutable
#   fields); only within-press ORDER/transitions relax (reported INFO). Makespan can only stay
#   equal or improve. Verified by arvind-rao.
press_gap_fill:                true
building_gap_fill:             true    # v2 2026-07-30: building twin of press_gap_fill (fill TBM idle vs prev_end cascade)
building_day_pool_sequence: true   # 2026-09-29: plant Shift Schedule is a DAY plan (Notes sheet) -> build each machine-day in order of curing need, from 07:00
building_kit_aware_dispatch: true   # 2026-09-30: next build row = earliest feasible start (kit + TBM free); fixes TBM idle behind a kit-late row
lft_cap_by_need: true   # 2026-09-30: component LFT <= its own need (building-plan time) - min aging; CPM LFT came from phase2 GT lots and ran 6-10 h late
lft_cap_skip_machines: []   # 2026-09-30 tested: skipping mixers+1802 loses the PCR gain (95.3/90.8 -> 94.9/90.4) -- mixers are the shared constraint
building_shift_pool: true     # 2026-09-30 BR-1: a build row may not start before its plan SHIFT (order inside the day is ours)
enforce_pm_downtime: true     # 2026-09-30 BR-10: downtime_reason PM/MTC windows blocked (presses, TBMs, upstream)
final_repair_pass: true       # 2026-09-30 BR-7/10/12/66: final pass enforces changeover matrix, PM, min+max aging kit (later-only)
final_repair_hard_max_aging: false   # TESTED 2026-09-30: true (expired = scrap, no remake) -> 65.6/63.1 built/cured, 176 builds short
compress_exclude_machines: ["F270", "K310", "F440", "K270M", "K430-1", "K430-2", "901"]   # v63: mixers (planner lots fixed) and 901 (4RC rules) never moved by the left-shift
compress_alt_machine_departments: ["TBR APEXED BEAD ASSEMBLY", "BEAD WINDING", "BEAD WINDING PCR", "BEAD APEXING"]   # v69 #4
batch_release:                     # v69 #2 (user 2026-10-10): compound lots usable batch by batch (+ min aging), consumers in need order
  enabled: true
  item_types: ["MASTER COMPOUND", "FINAL COMPOUND"]
curing_aware_building:             # v69 #5 (user 2026-10-10): rows whose tyres would wait > gt_life_h - margin_h for presses go behind
  enabled: true
  gt_life_h: 72
  margin_h: 8
  penalty_h: 24
upstream_gap_fill:                  # v81 (user 2026-10-12): close the idle on component machines (GAP_12_15_OCT_v80.md)
  floor_to_ready: true              # A1: final repair floor = upstream open on component machines (not mixers / 901) -> lots move back
                                    #     into idle when inputs + min aging, machine predecessor + matrix changeover, PM and shelf life allow
  repeg_compounds: true             # A2: compound batches re-allocated FEFO to component lots (earliest-ready to earliest-start)
  repeg_mode: compounds             # v83 TESTED (user 2026-10-12) "item_stock": every upstream item re-allocated FEFO, need net of opening
                                    #      stock -> cured 127,708 (v82 127,866), TBR +315, PCR -473, 1801/1803 family rules worse. NOT kept.
                                    #      "compounds" = v81/v82 behaviour (current)
  family_reorder: true              # v82: a later lot of the SAME compound family (same item on BR-56 cutters) as the lot before or after
                                    #      an idle gap moves into it (inputs, changeover, PM, shelf life kept; family switches never rise)
  min_gap_min: 30
compress_upstream: true    # v63 (user 2026-10-10): ON -- upstream lots (not mixers / 901) move EARLIER into idle (inputs + min aging, shelf floor, changeover allowance kept). Was:   # 2026-09-30 TESTED: neutral (21 moves, same 97.1/92.6) -- no idle mixer time to move into
compress_changeover_pad_min: 30
compress_aging_margin_h: 2.0
compress_sweeps: 2
capacity_aware_lft: false   # 2026-09-30 TESTED: worse (95.7/91.2) -- reprioritising saturated mixers only moves the shortage

# ---- BEST-PRESS -- mould-capped earliest-finish curing re-placement (phase6) --------
# best_press_curing: phase6's default is the verbatim v6 port -- each block stays on
# the press plan.csv named and only slides LATER. That pins the makespan to plan.csv's
# press choice: a SKU the LP put on ONE press cures serially even though routing allows
# many. When ON, phase6 re-places every curing block onto the routing-eligible press
# with the EARLIEST finish, under three HARD real constraints:
#   * kit-gate   -- never start before the block's own kit_ready (green tyre must exist);
#                   the FIFO green-tyre->block match from revise_curing_schedule() is REUSED,
#                   only the press + start move.
#   * mould-cap  -- a SKU never runs on more presses AT ONCE than it has moulds. The cap
#                   DEFAULTS to the plan's own max concurrency per SKU -- a PROVEN lower
#                   bound (the plan already runs that many at once). It NEVER invents a
#                   mould. Supply real plant counts in curing_mould_counts to raise it.
#   * changeover -- a mould change costs curing_changeover_min (below) when a press switches SKU.
# MEASURED (outputs2): verbatim 37.0d -> best-press 34.85d, PHYSICALLY VALID (concurrency
# never exceeds the plan's own). It does NOT beat the BUILDING floor (last green tyre's
# kit_ready ~33.4d) -- going lower is a building-rope lever, not a curing one. plan.csv and
# routing.csv are READ ONLY. The E4 gate for this path checks routing-eligibility + mould-cap
# in place of the (now intentional) pressNo/sequence changes.
#   DEFAULT FALSE = v6's verbatim behaviour. Turn ON for the ~2.15d curing recovery.
best_press_curing:             false
# Mould-change (changeover) cost in minutes for the best-press path. 300 = 5 h = the plan's
# own CHANGEOVER-row value. Only used when best_press_curing is ON.
curing_changeover_min:         300
# CHANGEOVER-TOLERANCE (hours). Best-press's makespan gain and its mould-change COUNT are
# tightly coupled: pure earliest-finish (tol 0) reaches 34.95d but at ~270 mould changes vs
# the plan's 56. Raising this makes a block WAIT up to `tol` on a press it can keep (no
# changeover) rather than switch -- FEWER changeovers, but makespan degrades FAST. Measured
# frontier: 0h->34.95d/270 | 2h->36.83d/177 | 5h->45.97d/72. There is NO point with ~56
# changeovers AND makespan < 37d -- the verbatim plan (37.0d/56) is already changeover-optimal.
# Default 0 = max makespan gain. See BEST_PRESS_CURING.md sec.10.
curing_changeover_tolerance_h: 0
# OPTIONAL plant-supplied physical mould counts, per SKU code, e.g.
#   curing_mould_counts: { "1D25218Z14008RXC10": 3, "1325219515091HURL2": 5 }
# Each entry SUPERSEDES the plan-derived cap for that SKU. Leave empty to use the proven
# plan-concurrency lower bound (never invents a mould). ASK THE PLANT before raising any.
curing_mould_counts:           {}

# ---- DECLINED. THIS IS A TRAP. DO NOT TURN IT ON. -----------------------------
# resequence_press_queue_by_kit: DECLINED AND MUST STAY OFF.
#
# It looks like a free win ("save 3 days") and it is not. MEASURED:
#   - It takes press SKU-transitions from 56 -> 339.
#   - plan.csv reserves EXACTLY 56 CHANGEOVER blocks. The other 283 mould changes have
#     ZERO press time reserved for them: 566 - 1,132 press-hours of mould changes that
#     the schedule never pays for, against just 19.8 h of total fleet mid-horizon idle.
#     There is nowhere to put them.
#   - And phase6 DELETES the changeover rows (see reinsert_changeover_blocks above), so
#     it charges ZERO for a mould change. It would be OPTIMISING AGAINST A COST FUNCTION
#     THAT IS BLIND TO THE COST it is incurring.
#
# Its "3 days saved" are an ARTEFACT OF THAT BLINDNESS, not a real saving. Do not enable
# this until changeovers are (a) reinserted and (b) actually charged to the press.
resequence_press_queue_by_kit: false

# ---- (B) POLICY -- FLAGGED, LEFT OFF ------------------------------------------
# schedule_master_mixing: v6 carries a NAMED, DELIBERATE assumption in phase2 --
# "MASTER COMPOUND is treated as always available -- never produced." It executes that
# rule correctly, so changing it is (B) POLICY, not a bug fix. DEFAULT FALSE = v6.
#
# WHAT THE v6 ASSUMPTION COSTS (phase2 now reports this LOUDLY on every run):
#   master-compound lots created            : ZERO
#   master-compound demand left unscheduled : ~3.5 MILLION kg
#   Banburys 270M / 430-1 / 430-2 / 440M    : ABSENT from the utilisation report
#                                             ENTIRELY -- as if they did not exist
#   and the routing HAS 6,972 fully-populated MASTER MIXING rows. The data is there.
#
# !! WARNING BEFORE YOU TURN THIS ON. It makes the schedule **LONGER, NOT SHORTER.**
#    It does not unlock capacity -- it ADDS A WHOLE UPSTREAM STAGE that is simply absent
#    today. 3.5M kg must now be mixed, sequenced and aged BEFORE final mixing can begin,
#    and every downstream lot gains a new predecessor. Expect the horizon to move OUT.
#    That is the honest cost of modelling reality, and it is why this is a decision.
schedule_master_mixing:        true    # USER-DIRECTED (2026-07-16): ON. Schedule the masterbatch mixing stage (3.5M kg, 89 items) on the Banbury mixers -- master compound now in BOTH demand and schedule. Adds a whole upstream stage before final mixing; makespan expected to LENGTHEN (honest cost of modelling reality).

# ---- PLANT-CONFIRMED 2026-07-14 -----------------------------------------------
# mixer_changeover_min: 2 minutes. See the long note at machine_to_changeover_line.
# THIS IS ALREADY WHAT v6 DOES. No code change. The key exists so nobody "fixes" it.
mixer_changeover_min:          1       # 2026-09-30 BR-74: plant override of the stated 2 min (now actually read by phase5)

