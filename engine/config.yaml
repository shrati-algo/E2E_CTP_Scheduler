# ==============================================================================
# L7 -- AGING-AWARE LOT SPLIT.  (A) DEFECT REPAIR.  DEFAULT OFF = v6 byte-identical.
# ==============================================================================
# THE DEFECT (phase2_lot_sizing.size_lots_waveaware): lots are sized by DURATION (8h)
# and wave/sub-wave buckets, but a lot's CONSUMER SPAN is never capped at the item's
# aging window. SHORT_AGING_THRESHOLD_H uses a STRICT `<`, so any item with
# max_aging >= 48h (Bead Bundle 48h, Green Tyre 48h in aging_master, Tread/SideWall/
# Inner Liner/Calandared Roll 72h) gets NO sub-wave bucketing -- a single ~72h wave
# becomes ONE lot whose consumers span up to 71h. The material made at the lot's start
# is then 71h old when the last consumer takes it, past a 48h shelf. This is the L7
# validation FAIL (204 real material lots) and a lot-sizing root of phase4 aging
# violations. Example: BW13001 (Bead Bundle, 48h) drawn over 71h.
#
# THE FIX (this flag ON): additionally split a lot so its earliest->latest consumer
# need_by span <= (max_aging - min_aging) - safety. SURGICAL -- only sub-buckets that
# ACTUALLY violate (span > window + 0.5) are touched; everything else, incl. cap-strip
# (already 12h-bucketed under its 24h window), is byte-for-byte unchanged, so L9 is not
# inflated by this pass. safety defaults to the item's transfer_time (the lag phase4/5
# already add to min_aging); aging_split_safety_h sets a flat override instead.
#
# DEFAULT FALSE => the split code never runs => byte-identical to the v6 baseline.
# !! GREEN TYRES ARE EXCLUDED BY DEFAULT (aging_split_exclude_itypes). They are the
#    BUILDING DRUM. MEASURED (split ALL item types incl. GT): building changeovers
#    371 -> 584 (+213), makespan 33.30 -> 34.21 d (+0.91), a NEW L9 item (a GT code at
#    104 lots), and the kit mix drifted 7018/193/62 -> 7015/196/62 -- all from splitting
#    the 14 GT violators (the drum). MEASURED (components only, GT excluded): the 190
#    non-GT violators clear at a fraction of that cost, GT lots/kit untouched. GT
#    freshness is already governed by phase5/phase6 (24h override + streaming gate), not
#    by this component-shelf-life split, and GT's L7 window uses aging_master's 48h which
#    is looser than the plant's confirmed 24h. So the drum is held out of this pass.
aging_aware_lot_split:   true
aging_split_exclude_itypes: ["Green Tyres"]   # [] = split ALL incl GT (L7->0); ["Green Tyres"] = exclude the drum. Toggle here.   # item types NOT split (the drum). [] = split all.
# aging_split_safety_h:  0.5   # uncomment for a FLAT safety (h) instead of per-item transfer
# PRODUCTION-SMOOTHING SPLIT (2026-08-02): master/final compound lots span ~8.8 days (their 15-day
# shelf lets the aging split never fire), so a batch pulls ~9 days of compound to its FIRST (day-1)
# consumer -> the day-0 mixer must make 1.13M units at once (should be ~180k). Cap these to a 48h
# consumer-span so each lot is ~2-day, spreading compound so the ramp only makes the near-term share.
smooth_lot_span_itypes: ["MASTER COMPOUND","FINAL COMPOUND","CALANDARED ROLL","Capstrip Mother Roll","Cap Strip","Steel Belt Edge Strip","SLITTED MATERIAL","Slitted Material","Edge Gum","SideWall","Tread","Inner Liner","Steel Belt","Bead Bundle","PRE CUT ROLL MATERIAL","SHOULDER PAD","Rubberized Ply"]   # 2026-09-27 BRE-01/BRIL-01: SW/TRD/IL on a rolling 24 h building horizon
smooth_lot_span_h_by_itype: {}   # v65: off again (v63 / v64 test {FINAL 8, MASTER 12}: more lots, +2-3 % batches, PCR -6k)   # v63 (user 2026-10-10): compound lots ~one shift of need so the next section consumes as we make (runs still back to back, no changeover)
