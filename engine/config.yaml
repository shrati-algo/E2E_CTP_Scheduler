# ═══ C4 HONEST-LFT ANCHOR (phase4) ══════════════════════════════════════════════════
# Fixes the C4 negative-slack REPORT artifact: phase3 fan-out over-links each feeder lot to
# every GT in its wave, so the backward CPM collapses the feeder LFT onto the wave's earliest
# GT (median 38.7 h too tight). Re-anchors each non-terminal lot's LFT to its OWN last_need.
#   off    = v6, byte-identical (DEFAULT).
#   report = truthful LFT/LST/slack in the report; phase5 placement byte-identical (uses
#            LFT_place = original LFT for caps, AEST from original LST). C4 4,180 -> ~61.
#   full   = honest LFT also drives AEST/placement (JIT-er) — NOT schedule-neutral, measured.
