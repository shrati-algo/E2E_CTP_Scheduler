# ═══ V35 COVER-FIRST DISPATCH CD-1..3 (2026-10-06, user) — every section ═══════════════════════════════════
# CD-1: cover_h = (stock + aged WIP) / consumption rate; under the threshold = urgent -> lowest cover runs next.
#   building: threshold building_threshold_h (8 h = one shift; v34 90th-pct restock PCR 5.6 h / TBR 4.6 h + margin);
#   upstream: urgent when the lot must start now to finish upstream_margin_h before its first consumer (the window
#   already holds changeover + run time + min aging / transfer from CTP_Master_Aging / routing).
# CD-2: equal cover -> the SKU / item feeding FEWER moulds (presses in the curing plan) first (user).
# CD-3: nothing urgent -> same item, then same compound family, then the cheapest matrix changeover, then the next;
#   next-day lots of the same family may join today's run (shelf life / first consumer still bound it).
cover_dispatch:
  enabled: false   # v36 (user): v26 rule set + v27-v31 rules -> OFF
  building_threshold_h: 8
  upstream_margin_h: 2
  ready_slack_min: 60               # building: rows that can start within 60 min of the TBM's earliest are "ready"
  tie_break: fewer_moulds
  mixing:                           # mixers join the family pass (family = main BOM input)
    enabled: true
    machines: ["K270M", "K310", "K430-1", "K430-2", "F270", "F440"]
    max_delay_h: 12
    max_pull_h: 12
    fixed_compounds: ["30G", "IL3", "IL5", "B1", "B2", "B99", "29MG", "ML405", "ML406", "ML605",
                      "MB100", "MB200", "XMB98", "JT444", "JT466", "MK3"]   # butyl / IL / sticky / follower rules keep their place

# ═══ V37 EFFICIENCY = 1 (2026-10-06, user) ═══════════════════════════════════════════════════════════════
# Every routing efficiency is taken as 1.0 (was routing 0.96; CAP PLY SLITTER override 0.78 incl. bobbin changes):
# upstream run time (phase2 op_duration_min, incl. mixing), building time (phase5 V23 cycle / eff) and the checks.
