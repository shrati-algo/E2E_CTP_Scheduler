# Resolved CTP scheduler rules - the full v46k rule set in ONE file.
# Generated from pns-ctp-scheduler/config/rules_v46k.yaml by following
# inherit_from to the root (rules.yaml); config/history/ keeps that chain
# (v46f..v46k added). Two paths differ from the history files:
# bypass_cut_code_types_from and wip.bypass_conversion_bom point at
# <data>/reference_bom (the pre-v2 BOM), which refresh_ctp_sql.py --bom-v2
# stages inside the data folder.
# v46k over v46e: CAP 66 made on 901 (no CAP 66 assumptions), 901 campaign pick
# by trolley need, CAP 66 stock converted by MHE code (STL 10:1 ASSUMED),
# SNCT001-003 / BCFT002 cut stock converted to BRTTL (width from the BOM;
# SNCT001/SNCT003 pre-cut rolls taken as ALTERNATIVES - open issue).
# Change knobs here; see docs/ for what each version added.
