# Resolved CTP scheduler rules - the full v46e rule set in ONE file.
# Generated from pns-ctp-scheduler/config/rules_v46e.yaml by following
# inherit_from to the root (rules.yaml); config/history/ keeps that chain.
# Two paths differ from the history files: bypass_cut_code_types_from and
# wip.bypass_conversion_bom point at <data>/reference_bom (the pre-v2 BOM),
# which refresh_ctp_sql.py --bom-v2 stages inside the data folder.
# Change knobs here; see docs/ for what each version added.
meta:
  source: pns-ctp-scheduler config/rules_v46e.yaml and its inherit_from chain
  transcribed: 2026-09-26
  note: 'Plant-confirmed rules that override default/derived values. Where this file and the database
    disagree, this file wins and the engine says so.

    '
  plant: CTP
  plan: plan-latest/ (October 2026, pcr 26 / tbr 27)
  inventory: jkplanning_CTP.opening_wip
  run: v46e
  variant: kit-ready building dispatch + full sequencing
  supersedes: Upstream Business Rules.xlsx (48 rules) - see rules_upstream.yaml
  goal: resolved v46e rule set (single file)
  buffer_source: jkt_buffer_master_{line} only - resolved to BOM names from the database
  sources:
    mpq: JK_CTP_PPDS.CTP_Master_MPQ
    buffer: JK_CTP_PPDS.CTP_Master_Buffer
    wip: JK_CTP_PPDS.CTP_Opening_WIP
    aging: JK_CTP_PPDS.CTP_Master_Aging
    bom: JK_CTP_PPDS.CTP_Master_BOM_v2 (verbatim); reference_bom/ = JK_CTP_PPDS.CTP_Master_BOM
    routing: jkplanning_CTP.jkt_routing_{line}
    frc: JK_CTP_PPDS.CTP_Master_FRC
  wip_snapshot: JK_CTP_PPDS.CTP_Opening_WIP @ 2026-09-29, sync 06:30
  wip_rows: 7587
  wip_units: 160910
  wip_source: JK_CTP_PPDS.CTP_Opening_WIP strike 2026-09-29 06:30 + planning for codes it lacks
  compound_rebuilt: 4,653 batches x routing batch_size = 1,017,205 kg
  assumption: upstream ran 24 h ahead of the building plan; not visible in the 06:30 floor
  purchased_source: CTP Data Gaps Report (2).xlsx -> data-sql/CTP_Purchased_Items.csv
  data: a folder staged with refresh_ctp_sql.py --ppds-only --bom-v2 (BOM v2 + reference_bom/ + CTP_Master_FRC)
