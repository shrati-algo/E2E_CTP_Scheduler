    effect: beads ordered by need-by only
    missing: no bead-round attribute on CTP bead items
    rule: 4-round beads scheduled together, same for 5-round
  BRB-02:
    effect: wire campaigns not formed
    missing: no wire-type master for CTP (BTP has belt_wire_mapping; CTP does not)
    rule: Same wire type should run continuously
  BRE-02:
    effect: die-based grouping not enforced
    missing: no die / profile attribute on any CTP extrusion item
    rule: Same die should not be repeated in a shift
  BRG-01:
    effect: every machine is treated as available 24x7; utilisation is optimistic
    missing: no PM / maintenance-downtime table exists in jkplanning_CTP
    rule: No production or changeover on a machine during its PM/MTC block
  BRIL-02:
    effect: as above, for IL calendering
    missing: same - no die master
    rule: Same die/profile should not be repeated in a shift
