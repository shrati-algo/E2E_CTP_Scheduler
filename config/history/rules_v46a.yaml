# =====================================================================
#  rules_v46a.yaml - v45b + CUT / SLIT STOCK BECOMES STOCK OF ITS CHILDREN
#  The cutters and slitters are bypassed (not scheduled). Material the plant
#  already cut or slit is turned back, when the opening stock is read, into
#  the BOM child it was cut from (calendered roll, edge strip, ...), using the
#  BOM ratio child_quantity / Parent_qty (bias cutter: child_quantity). That
#  child stock is then netted like any other stock.
#  It is usable at produced_time + the cut code's own minimum ageing, which
#  is the transfer time across the bypass (bypass_transfer_from_min_aging,
#  on since v34, still applies to everything newly made).
#  Rows that cannot be converted (unit mismatch / no BOM child) stay on the
#  cut code and are netted as before (cold_start.net_cut_stock).
# =====================================================================
inherit_from: rules_v45b.yaml
meta: {run: e2e_v46a, goal: "v45b + cut/slit stock converted to its child material", data: "data-ppds-v38/"}
wip:
  bypass_stock_to_children: true
bypass_transfer_from_min_aging: true
