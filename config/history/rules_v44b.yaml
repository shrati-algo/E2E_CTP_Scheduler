#
#  Phase 2 tested "has this stock rested?" against ONE time per item - the
#  first trolley that ever needs it - so stock mixed in the hours before the
#  bell (TBR A1031 4,830 kg ready 07:30-08:08; first use 07:07) was thrown
#  away for the whole plan (31k PCR / 16k TBR units, mostly final compound).
