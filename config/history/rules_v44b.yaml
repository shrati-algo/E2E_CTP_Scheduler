#  (need_by + min aging); the first-use time stays as the floor and expiry is
#  unchanged.
# =====================================================================
inherit_from: rules_v44a.yaml

meta:
  run: e2e_v44b
  goal: "v44a + opening stock maturity per demand"
  data: "data-ppds-v38/"

